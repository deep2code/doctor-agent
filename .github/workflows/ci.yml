name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
      - name: Run lint
        run: golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    # The knowledge/session/server suites read the MariaDB knowledge store, so
    # CI provides a real instance and seeds it from the gz sources first.
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      MARIA_DB_HOST: 127.0.0.1
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Seed knowledge database
        run: go run . seed-knowledge
      - name: Run tests
        # The knowledge suite decompresses + classifies the two >100MB QA seeds
        # (TestBakeBigCorporaZST) and runs the full BM25 layer under -race;
        # measured ~10min locally, so the 10m default is not enough.
        run: go test ./... -race -count=1 -timeout 30m
      - name: Verify knowledge
        run: go run . verify-knowledge

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Build binary
        run: |
          go build \
            -ldflags "-s -w -X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/doctor-agent .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install python deps
        run: python3 -m pip install --no-input "zstandard==0.23.0"
      - name: Regenerate gz
        run: python3 external/make_gz.py
      - name: Build app image
        run: |
          docker build \
            --build-arg GIT_COMMIT=test \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f Dockerfile \
            .
        # NOTE: the qdrant RAG image (Dockerfile.qdrant) is intentionally NOT
        # built in CI — baking ~743k vectors needs more RAM/time than a CI
        # runner should spend; build it locally via ./build.sh qdrant.

  verify-gz:
    name: Verify embedded data
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install python deps
        # make_gz.py compresses with zstd level 19 via the `zstandard` binding
        # (there is no `gzip` package on PyPI; without this it silently falls
        # back to the system zstd CLI).
        run: python3 -m pip install --no-input "zstandard==0.23.0"
      - name: Check gz is in sync with data/
        # Read-only content check (decompress gz/ and compare to the source
        # bytes). Deliberately not "regenerate then git diff": a zstd frame is
        # only byte-stable for one library version, so a byte diff would flag
        # every zstandard bump as stale data.
        run: python3 external/make_gz.py --check
