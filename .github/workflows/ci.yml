name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + Test + Knowledge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Knowledge base integrity
        run: go run . verify-knowledge

      - name: Offline evals (golden set, anti-hallucination)
        run: go run ./evals

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      # golangci-lint v2 (matches the local toolchain); built via go install
      # so the binary matches the runner's Go version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Run lint
        run: |
          set +e
          GOLANGCI="$(go env GOPATH)/bin/golangci-lint"
          "$GOLANGCI" run --timeout=5m > /tmp/lint.log 2>&1
          code=$?
          echo "LINT_EXIT=$code"
          cat /tmp/lint.log
          exit $code

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: /tmp/lint.log
