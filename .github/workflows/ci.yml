name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + Test + Knowledge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Knowledge base integrity
        run: go run . verify-knowledge

      - name: Offline evals (golden set, anti-hallucination)
        run: go run ./evals

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      # golangci-lint-action failed at the action layer; the official release
      # binary also fails to start on the runner (fails in ~2s). Building via
      # `go install` with the same Go toolchain as setup-go works locally and
      # is guaranteed to match the runner's Go version.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.2

      - name: Run lint
        run: |
          set +e
          "$(go env GOPATH)/bin/golangci-lint run --timeout=5m" > /tmp/lint.log 2>&1
          code=$?
          echo "LINT_EXIT=$code"
          cat /tmp/lint.log
          exit $code

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: /tmp/lint.log
