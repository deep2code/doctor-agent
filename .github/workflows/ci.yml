name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + Test + Knowledge checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Knowledge base integrity
        run: go run . verify-knowledge

      - name: Offline evals (golden set, anti-hallucination)
        run: go run ./evals

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      # golangci-lint-action was failing at the action layer (install step);
      # use the official installer script directly instead.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v1.64.2

      - name: Run lint
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout=5m"
