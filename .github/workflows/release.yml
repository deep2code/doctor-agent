name: Release

# 打包发布工作流：
#   - push `v*` tag 时自动构建多平台二进制并发布 GitHub Release
#   - 也可在 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          GIT_COMMIT="${GITHUB_SHA:0:7}"
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          EXT=""
          [ "${{ matrix.os }}" = "windows" ] && EXT=".exe"
          mkdir -p dist
          go build -trimpath -ldflags "-s -w \
            -X main.gitCommit=${GIT_COMMIT} \
            -X main.buildTime=${BUILD_TIME}" \
            -o "dist/doctor-agent-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}${EXT}" .

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: doctor-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
