name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Get version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags "-X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/doctor-agent-linux-amd64 .

      - name: Build Linux arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -ldflags "-X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/doctor-agent-linux-arm64 .

      - name: Build macOS amd64
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/doctor-agent-darwin-amd64 .

      - name: Build macOS arm64
        run: |
          GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/doctor-agent-darwin-arm64 .

      - name: Build Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-X main.gitCommit=${{ github.sha }} -X main.buildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/doctor-agent-windows-amd64.exe .

      - name: Create start-chat scripts
        run: |
          # Linux/macOS start script
          cat > dist/start-chat << 'STARTSCRIPT'
          #!/bin/bash
          # doctor-agent 一键启动脚本
          set -e

          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"

          # Detect platform
          OS="$(uname -s)"
          ARCH="$(uname -m)"

          case "$OS" in
            Linux)  PLATFORM="linux" ;;
            Darwin) PLATFORM="darwin" ;;
            *)      echo "❌ 不支持的操作系统: $OS"; exit 1 ;;
          esac

          case "$ARCH" in
            x86_64|amd64) ARCH_NAME="amd64" ;;
            aarch64|arm64) ARCH_NAME="arm64" ;;
            *)            echo "❌ 不支持的架构: $ARCH"; exit 1 ;;
          esac

          BINARY="$SCRIPT_DIR/doctor-agent-${PLATFORM}-${ARCH_NAME}"
          if [ ! -f "$BINARY" ]; then
            echo "❌ 找不到二进制文件: $BINARY"
            exit 1
          fi

          chmod +x "$BINARY"
          exec "$BINARY" "$@"
          STARTSCRIPT
          chmod +x dist/start-chat

          # Windows start script
          cat > dist/start-chat.bat << 'BATSCRIPT'
          @echo off
          REM doctor-agent 一键启动脚本
          setlocal

          set SCRIPT_DIR=%~dp0
          set BINARY=%SCRIPT_DIR%doctor-agent-windows-amd64.exe

          if not exist "%BINARY%" (
            echo 找不到二进制文件: %BINARY%
            exit /b 1
          )

          "%BINARY%" %*
          BATSCRIPT

      - name: Generate checksums
        run: |
          cd dist
          sha256sum doctor-agent-* start-chat > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Doctor Agent ${{ steps.version.outputs.tag }}"
          body: |
            ## 循证医学 AI 助手

            ### 快速开始
            1. 下载对应平台的 `doctor-agent-{os}-{arch}` 二进制
            2. 下载 `start-chat` 脚本（Linux/macOS）或 `start-chat.bat`（Windows）
            3. 双击 `start-chat` 即可启动，首次运行会引导配置 API Key

            ### 支持的 LLM
            - 智谱 glm-4-flash（免费推荐）
            - DeepSeek
            - 豆包（火山方舟）

            ### 命令行
            ```bash
            doctor-agent chat              # CLI 对话模式
            doctor-agent serve             # HTTP API 服务
            doctor-agent verify-knowledge  # 知识库校验
            doctor-agent version           # 版本信息
            ```
          files: |
            dist/doctor-agent-linux-amd64
            dist/doctor-agent-linux-arm64
            dist/doctor-agent-darwin-amd64
            dist/doctor-agent-darwin-arm64
            dist/doctor-agent-windows-amd64.exe
            dist/start-chat
            dist/start-chat.bat
            dist/checksums.txt
          draft: false
          prerelease: false
