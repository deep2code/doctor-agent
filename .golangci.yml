# golangci-lint configuration (golangci-lint run ./...)
# v2 format — requires golangci-lint v2.13.0+ (CI pins it; the old local v2.12.2
# binary cannot build/parse Go 1.27). Run locally with:
#   go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0 run ./...
# Conservative: the standard linter set plus a few safe additions.
#
# Note: exclusions live under `linters.exclusions` in v2 — the v1
# `issues.exclude-rules` block is silently inert, which is why the old test-file
# errcheck exclusion below never took effect.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - misspell
    - gocritic
  settings:
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        # os.Exit in main() legitimately skips deferred cleanup; the process is
        # going away anyway.
        - exitAfterDefer
    errcheck:
      # Best-effort cleanup closes: `defer rows.Close()` / `defer zr.Close()`
      # after the read already finished, and Close on a handle whose data has
      # been fully consumed. The error has nowhere useful to go, so checking it
      # would only add a no-op branch. Writer closes (gzip.Writer, temp files
      # feeding an upload) are deliberately NOT excluded here.
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*compress/gzip.Reader).Close
        - (*os.File).Close
        - (io.Closer).Close
        - (mime/multipart.File).Close
        - (*github.com/doctor-agent/internal/knowledge.KB).Close

  exclusions:
    rules:
      # Test helpers may ignore errors — the assertion fails anyway.
      - path: _test\.go
        linters:
          - errcheck
      # Store.ensureXxx() lazy loaders are called for effect: a load failure
      # surfaces as an empty cache (and thus an empty retrieval), not as an
      # error the retriever can return. Checking it at ~19 call sites would add
      # no-op branches only.
      - linters:
          - errcheck
        text: '`[a-zA-Z0-9_.]*\.ensure[A-Z]\w*`'
