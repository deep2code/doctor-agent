# doctor-agent — 源码构建版(用于在本机/CI 构建镜像)
#
# 适用:你有一份完整项目源码(含 Dockerfile、internal/knowledge/gz/* 等),
#       想在本机把镜像 build 出来,再 push 到镜像仓库或 docker save 成 tar 包。
#
# 用法:
#   docker compose -f docker-compose.build.yml build
#   docker compose -f docker-compose.build.yml push   # 若已打标签到你的仓库

services:
  mariadb:
    image: mariadb:11.4
    container_name: doctor-agent-mariadb
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doctor-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 知识库数据基础镜像(本地构建):50 个 gz 拷入命名卷,供 app 挂载
  knowledge-data:
    build:
      context: .
      dockerfile: Dockerfile.data
    image: ${DATA_IMAGE:-doctor-agent-data:latest}
    command: ["sh", "-c", "cp -r /opt/knowledge/gz/* /data/ && echo 'knowledge data ready'"]
    volumes:
      - knowledge_data:/data
    restart: "no"

  app:
    build: .
    image: ${IMAGE_NAME:-doctor-agent:latest}
    container_name: doctor-agent
    ports:
      - "7071:7071"
    volumes:
      - knowledge_data:/opt/knowledge/gz
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7071
      MARIA_DB_HOST: mariadb
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
      MARIA_DB_KNOWLEDGE_DB: doctor_knowledge
      MARIA_DB_APP_DB: doctor_agent
      VECTOR_STORE_ENABLED: "true"
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: "6334"
      VECTOR_COLLECTION: medical_knowledge
      EMBEDDING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      mariadb:
        condition: service_healthy
      qdrant:
        condition: service_started
      knowledge-data:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mariadb_data:
  qdrant_data:
  knowledge_data:
