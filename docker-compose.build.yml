# doctor-agent — 源码构建版(用于在本机/CI 构建镜像)
#
# 双镜像架构（2026-08-30）:
#   doctor-agent-qdrant  纯 gz 知识库(alpine 51 数据集) + 标准 Qdrant + 向量
#                        → 只有知识库变化才更新
#   doctor-agent         Go 源码 + 前端(go:embed web/*.html)
#                        → 只有代码变化才更新
#
# 用法:
#   docker compose -f docker-compose.build.yml build app    # 先构建 app
#   docker compose -f docker-compose.build.yml build qdrant # 再构建 qdrant
#   docker compose -f docker-compose.build.yml push         # 若已打标签到你的仓库
#
# 注意: qdrant 用【独立 context】(docker/qdrant-context, 只含 gz)构建,
#      因为项目根 .dockerignore 排除了 gz(为 app 瘦身)。
#      也可以直接用 ./docker/qdrant-context/build.sh 构建。

services:
  mariadb:
    image: mariadb:11.4
    container_name: doctor-agent-mariadb
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 专业 RAG 镜像(纯 gz 知识库 + 标准 Qdrant + 烘好的向量;独立 context)
  # 依赖: 先构建 app 镜像(它提供 vector-bake 二进制, COPY --from 引用)
  qdrant:
    build:
      context: ./docker/qdrant-context
      dockerfile: Dockerfile
      args:
        APP_IMAGE: ${APP_IMAGE:-doctor-agent:latest}
    image: ${QDRANT_IMAGE:-doctor-agent-qdrant:latest}
    container_name: doctor-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-doctor-agent:latest}
    container_name: doctor-agent
    ports:
      - "7071:7071"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7071
      MARIA_DB_HOST: mariadb
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
      MARIA_DB_KNOWLEDGE_DB: doctor_knowledge
      MARIA_DB_APP_DB: doctor_agent
      VECTOR_STORE_ENABLED: "true"
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: "6334"
      VECTOR_COLLECTION: medical_knowledge
      EMBEDDING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    depends_on:
      mariadb:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb_data:
  qdrant_data:
