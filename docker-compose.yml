# doctor-agent — 纯镜像版(服务器零源码,一个 compose 全跑起来)
#
# 前提:服务器上已经存在镜像 doctor-agent:latest(以下任一方式获得):
#   A) 从公开/私有仓库拉取:把 IMAGE_NAME 指向你的仓库,例如
#        echo "IMAGE_NAME=docker.io/你的用户名/doctor-agent:latest" > .env
#      然后本 compose 直接拉取。
#   B) 本机 docker save 成 tar 包传到服务器后 docker load:
#        docker save doctor-agent:latest -o doctor-agent.tar
#        # 服务器上: docker load -i doctor-agent.tar
#      此时 IMAGE_NAME 保持默认 doctor-agent:latest(本地镜像)即可。
#
# 启动(只此一条):
#   cp .env.example .env        # 仅需改 DEEPSEEK_API_KEY 等极少数项
#   docker compose up -d
#
# 说明:
#   - 采用「数据基础镜像」架构:50 个 gz 知识库单独在 doctor-agent-data 镜像,
#     app 镜像只含编译好的二进制(瘦镜像)。源码改动只重建很小的 app 镜像,
#     知识库层不动、不重烤。
#   - 知识库(doctor_knowledge)与业务库(doctor_agent)共用同一 MariaDB 实例,
#     由 app 启动时自动建库(无需外部 init SQL)。
#   - 首次启动自动 seed-knowledge(若 kb_items 已非空则跳过) + sync-knowledge。
#   - 数据通过 volume 持久化,重启不丢。Qdrant 不可用时自动降级关键词检索。

services:
  mariadb:
    image: mariadb:11.4
    container_name: doctor-agent-mariadb
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: doctor-agent-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # 知识库数据基础镜像:把 50 个 gz 拷入命名卷,供 app 挂载(数据层独立、不重烤)
  knowledge-data:
    image: ${DATA_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-data:latest}
    command: ["sh", "-c", "cp -r /opt/knowledge/gz/* /data/ && echo 'knowledge data ready'"]
    volumes:
      - knowledge_data:/data
    restart: "no"

  app:
    image: ${IMAGE_NAME:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent:latest}
    container_name: doctor-agent
    ports:
      - "7071:7071"
    volumes:
      - knowledge_data:/opt/knowledge/gz
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7071
      MARIA_DB_HOST: mariadb
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
      MARIA_DB_KNOWLEDGE_DB: doctor_knowledge
      MARIA_DB_APP_DB: doctor_agent
      VECTOR_STORE_ENABLED: "true"
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: "6334"
      VECTOR_COLLECTION: medical_knowledge
      EMBEDDING_ENABLED: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      mariadb:
        condition: service_healthy
      qdrant:
        condition: service_started
      knowledge-data:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mariadb_data:
  qdrant_data:
  knowledge_data:
