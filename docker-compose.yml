# doctor-agent — 四镜像版 compose（2026-10-02 校准：知识库与业务库拆成两个容器）
#
# 架构：
#   kb      → 知识库【基础数据】：doctor-agent-kb 镜像自带全量 doctor_knowledge，
#             不挂持久卷——每次重建都从镜像重新导入（实测 45-60 秒，导入完成前健康检查
#             一直不通过，所以 app 不会读到半空的库；镜像入口脚本自带"重新导入"保证，
#             见下面 kb 服务的注释）。镜像是什么版本，线上就是什么版本。
#   mariadb → 业务库【可变数据】：只有 doctor_agent（用户/会话/消息/反馈/家庭成员），
#             挂 mariadb_data 持久卷，是唯一需要备份的东西。
#   qdrant  → 专业 RAG 向量腿：doctor-agent-qdrant 镜像自带【构建期烘好的向量】，
#             启动即用、零灌入等待（gz 知识源不在镜像内，仅作构建期输入）。
#             与 kb 关键词层是混合检索的两条腿，不是替代关系。
#   embed   → 查询端 embedding：doctor-agent-embed（bge-m3 INT8, :18080），
#             必须与烘焙向量同模型，否则语义召回静默失效。
#   app     → Go 源码 + 前端，:7071。业务库读 MARIA_DB_*，知识库读 KNOWLEDGE_DB_DSN。
#
# 四镜像（触发条件解耦，见 build.sh）：
#   doctor-agent         Go 源码 + 前端            → 代码变化才更新
#   doctor-agent-qdrant  标准 Qdrant + 烘好的向量   → 知识库变化才更新
#   doctor-agent-embed   bge-m3 INT8 服务          → embedding 服务/模型变化才更新
#   doctor-agent-kb      预灌知识的 MariaDB         → 知识库数据变化才更新
#
# 前提：服务器上已存在镜像（以下任一方式获得）：
#   A) 从仓库拉取：默认已指向公共仓库；自定义用 .env 覆盖
#      IMAGE_NAME / QDRANT_IMAGE / EMBED_IMAGE / KB_IMAGE / APP_DB_IMAGE
#   B) 本机 docker save/load（各变量保持默认本地镜像名即可）
#
# 启动：
#   cp .env.example .env
#   docker compose up -d
#
# 说明：
#   - 知识库更新（新批次科普/指南）= 推送新的 doctor-agent-kb 镜像 → 在服务器上
#     `docker compose pull && docker compose up -d kb`，kb 容器重建后自动导入新数据。
#     业务库不受影响。
#   - /admin 的知识上传/同步写进的是 kb 容器的临时存储，容器重建即回落到镜像内容；
#     要永久生效必须做成新镜像（make_gz → kbseed → ./update-kb.sh）。
#   - qdrant 与 kb 同属"镜像即数据"，都不挂持久卷。
#   - 可选：若想用空 MariaDB 自灌，给 kb 换成 mariadb:11.4 并在 app 上设
#     SEED_MARIADB_KB=true + 挂 gz 卷，默认不启用。
#   - 2026-10-02 之前的部署：同一个 mariadb_data 卷里还留着一份旧的 doctor_knowledge
#     （约 1.1GB，现在已无人读取）。确认新拓扑跑通后可在业务实例里 DROP 它回收磁盘。

services:
  # 知识库容器：镜像即数据。不挂持久卷，且镜像自带的入口脚本会在每次启动时把上一次
  # 导入清掉再重新导入（实测：空目录首启 45 秒可用；挂着的卷被复用时也会重灌，60 秒）。
  # 为什么要在镜像里做：compose 重建容器时会【复用】上个容器留下的匿名卷（本机实测），
  # 光"不挂卷"会导致换了镜像还是旧知识——正是这次要消灭的状态。若误挂外来数据目录，
  # 入口脚本只告警、绝不删除别人的数据。
  # 健康检查在整份 dump 导完之前不会通过（mariadb 官方 healthcheck 读 @@skip_networking，
  # 导入期的临时服务返回 1），所以 app 的 service_healthy 依赖天然不会读到半空的库。
  kb:
    image: ${KB_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-kb:latest}
    container_name: doctor-agent-kb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    restart: unless-stopped

  # 业务库容器：唯一的持久卷，存用户/会话/消息/反馈/家庭成员。
  mariadb:
    image: ${APP_DB_IMAGE:-mariadb:11.4}
    container_name: doctor-agent-mariadb
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 专业 RAG：标准 Qdrant + 构建期烘好的向量（无 gz 数据层）
  # 只读部署模式（2026-08-30）：不挂持久卷——向量数据在镜像内（/qdrant/storage），
  # 容器重建即从镜像恢复，无需卷初始化复制（省一半磁盘）。WAL 写到 /tmp（容器可写层）。
  qdrant:
    image: ${QDRANT_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-qdrant:latest}
    container_name: doctor-agent-qdrant
    ports:
      - "6333:6333"
    environment:
      QDRANT__STORAGE__WAL_PATH: /tmp/wal
    restart: unless-stopped

  # 查询端 embedding: bge-m3 INT8 CPU (与烘焙向量同模型同空间)。
  # 模型已打进镜像 —— 打包机构建推送, 运行机直接拉, 无需模型文件。
  embed:
    image: ${EMBED_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-embed:latest}
    container_name: doctor-agent-embed
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:18080/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  app:
    image: ${IMAGE_NAME:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent:latest}
    container_name: doctor-agent
    ports:
      - "7071:7071"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7071
      MARIA_DB_HOST: mariadb
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
      MARIA_DB_APP_DB: doctor_agent
      # 知识库指向独立的 kb 容器（镜像即数据）。MARIA_DB_KNOWLEDGE_DB 只在该 DSN 为空时
      # 才用于拼 DSN，这里显式给出完整 DSN，所以应用永远不会去业务实例上找知识库。
      KNOWLEDGE_DB_DSN: "${MARIA_DB_USER:-root}:${MARIA_DB_ROOT_PASSWORD:-changeme}@tcp(kb:3306)/${MARIA_DB_KNOWLEDGE_DB:-doctor_knowledge}?parseTime=true&charset=utf8mb4&collation=utf8mb4_unicode_ci&interpolateParams=true"
      VECTOR_STORE_ENABLED: "true"
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: "6334"
      VECTOR_COLLECTION: medical_knowledge
      EMBEDDING_ENABLED: "true"
      EMBEDDING_BASE_URL: http://embed:18080/v1
      EMBEDDING_MODEL: model
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      kb:
        condition: service_healthy
      qdrant:
        condition: service_started
      embed:
        condition: service_started
    restart: unless-stopped

volumes:
  # 唯一的持久卷，且只承载业务库：知识库容器刻意不挂卷（见文件头说明）。
  mariadb_data:
  # qdrant_data 卷已移除（2026-08-30）：只读场景不挂卷，向量数据直接读镜像层
