# doctor-agent — 四镜像版 compose（2026-09-20 校准；原"双镜像"注释已过时）
#
# 架构：
#   mariadb → 同一实例承载两个库：业务库 doctor_agent（用户/会话/消息/反馈）
#             + 知识库 doctor_knowledge（关键词/精确查找层）。默认镜像 doctor-agent-kb
#             已在构建期灌好全量知识，空卷首启自动导入，运行时零 seed。
#   qdrant  → 专业 RAG 向量腿：doctor-agent-qdrant 镜像自带【构建期烘好的向量】，
#             启动即用、零灌入等待（gz 知识源不在镜像内，仅作构建期输入）。
#             与 mariadb 关键词层是混合检索的两条腿，不是替代关系。
#   embed   → 查询端 embedding：doctor-agent-embed（bge-m3 INT8, :18080），
#             必须与烘焙向量同模型，否则语义召回静默失效。
#   app     → Go 源码 + 前端，:7071。
#
# 四镜像（触发条件解耦，见 build.sh）：
#   doctor-agent         Go 源码 + 前端            → 代码变化才更新
#   doctor-agent-qdrant  标准 Qdrant + 烘好的向量   → 知识库变化才更新
#   doctor-agent-embed   bge-m3 INT8 服务          → embedding 服务/模型变化才更新
#   doctor-agent-kb      预灌知识的 MariaDB         → 知识库数据变化才更新
#
# 前提：服务器上已存在镜像（以下任一方式获得）：
#   A) 从仓库拉取：默认已指向公共仓库；自定义用 .env 覆盖
#      IMAGE_NAME / QDRANT_IMAGE / EMBED_IMAGE / KB_IMAGE
#   B) 本机 docker save/load（各变量保持默认本地镜像名即可）
#
# 启动：
#   cp .env.example .env
#   docker compose up -d
#
# 说明：
#   - qdrant 服务使用【自带烘焙向量的 RAG 镜像】（构建期 vector-bake 注入，
#     见根目录 Dockerfile.qdrant / Dockerfile.qdrant.slim）。首次启动即可语义检索，无 seed/sync 等待。
#   - app 启动时自动建业务库 doctor_agent；知识检索走 Qdrant + MariaDB 混合。
#   - 可选：若想用空 MariaDB 自灌，把 mariadb 镜像改回 mariadb:11.4，
#     把外部 gz 目录挂到容器并设 SEED_MARIADB_KB=true，默认不启用。

services:
  mariadb:
    # 预灌全部医学知识的数据镜像（版本号看 internal/knowledge/data/version.json，
    # tag 由 build.sh kb 自动取）——空卷首启自动导入, 运行时零 seed
    # 如需空库自灌, 改回 mariadb:11.4 并给 app 设 SEED_MARIADB_KB=true + 挂 gz 卷
    image: ${KB_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-kb:latest}
    container_name: doctor-agent-mariadb
    command:
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 60s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # 专业 RAG：标准 Qdrant + 构建期烘好的向量（无 gz 数据层）
  # 只读部署模式（2026-08-30）：不挂持久卷——向量数据在镜像内（/qdrant/storage），
  # 容器重建即从镜像恢复，无需卷初始化复制（省一半磁盘）。WAL 写到 /tmp（容器可写层）。
  qdrant:
    image: ${QDRANT_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-qdrant:latest}
    container_name: doctor-agent-qdrant
    ports:
      - "6333:6333"
    environment:
      QDRANT__STORAGE__WAL_PATH: /tmp/wal
    restart: unless-stopped

  # 查询端 embedding: bge-m3 INT8 CPU (与烘焙向量同模型同空间)。
  # 模型已打进镜像 —— 打包机构建推送, 运行机直接拉, 无需模型文件。
  embed:
    image: ${EMBED_IMAGE:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent-embed:latest}
    container_name: doctor-agent-embed
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:18080/healthz')"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  app:
    image: ${IMAGE_NAME:-crpi-0xi5k79l9j4opzta.cn-hangzhou.personal.cr.aliyuncs.com/codeup2026/doctor-agent:latest}
    container_name: doctor-agent
    ports:
      - "7071:7071"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 7071
      MARIA_DB_HOST: mariadb
      MARIA_DB_PORT: "3306"
      MARIA_DB_USER: root
      MARIA_DB_PASSWORD: ${MARIA_DB_ROOT_PASSWORD:-changeme}
      MARIA_DB_KNOWLEDGE_DB: doctor_knowledge
      MARIA_DB_APP_DB: doctor_agent
      VECTOR_STORE_ENABLED: "true"
      VECTOR_STORE_HOST: qdrant
      VECTOR_STORE_PORT: "6334"
      VECTOR_COLLECTION: medical_knowledge
      EMBEDDING_ENABLED: "true"
      EMBEDDING_BASE_URL: http://embed:18080/v1
      EMBEDDING_MODEL: model
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    volumes:
      - ./logs:/app/logs
    depends_on:
      mariadb:
        condition: service_healthy
      qdrant:
        condition: service_started
      embed:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb_data:
  # qdrant_data 卷已移除（2026-08-30）：只读场景不挂卷，向量数据直接读镜像层
