<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Agent 管理后台</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --accent: #2563eb; --accent-dark: #1d4ed8;
    --text: #1f2328; --muted: #6b7280; --border: #e5e7eb;
    --ok: #16a34a; --warn: #d97706; --err: #dc2626;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header .logo { font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); margin-left: 10px; }
  .container { max-width: 900px; margin: 24px auto; padding: 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 16px; margin-bottom: 14px; }
  .btn {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 9px 18px; font-size: 14px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  input[type=text], input[type=password], input[type=file] {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; margin-bottom: 12px;
  }
  .msg { padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 10px 0; display: none; }
  .msg.ok { background: #f0fdf4; color: var(--ok); border: 1px solid #bbf7d0; }
  .msg.err { background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .badge.ok { background: #f0fdf4; color: var(--ok); }
  .badge.warn { background: #fffbeb; color: var(--warn); }
  .drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 26px; text-align: center;
    color: var(--muted); cursor: pointer; transition: border-color .2s;
  }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  #login-wrap { max-width: 380px; margin: 80px auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; text-align: center; }
  .logout { font-size: 13px; color: var(--muted); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div id="login-wrap" style="display:none">
  <div class="card">
    <h2 style="text-align:center;font-size:20px;margin-bottom:20px">🩺 Doctor Agent 管理后台</h2>
    <input type="text" id="login-user" placeholder="用户名" value="admin" autocomplete="username">
    <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password">
    <button class="btn" id="login-btn" style="width:100%">登录</button>
    <div class="msg" id="login-msg"></div>
    <div class="hint">默认账户 admin，密码在启动日志或 ADMIN_PASSWORD 中查看</div>
  </div>
</div>

<div id="main-wrap" style="display:none">
  <header>
    <div><span class="logo">🩺 Doctor Agent</span><span class="sub">知识管理后台</span></div>
    <span class="logout" id="logout-btn">退出登录</span>
  </header>
  <div class="container">

    <div class="card">
      <h2>📤 上传 / 更新医学知识</h2>
      <div class="drop" id="drop">
        点击或拖拽 JSON / JSON.gz 文件到此处<br>
        <span style="font-size:12px">支持数据集：medical / drug / labtest / foodrisk / 指南类等（文件名即数据集名，如 diabetes.json、drug_contraindications.json）</span>
      </div>
      <input type="file" id="file-input" accept=".json,.gz" style="display:none">
      <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
        <button class="btn" id="upload-btn" disabled>上传并更新</button>
        <span id="upload-name" style="font-size:13px;color:var(--muted)"></span>
      </div>
      <div class="msg" id="upload-msg"></div>
    </div>

    <div class="card">
      <h2>📊 知识库统计 <span id="stats-total" style="font-size:13px;color:var(--muted);margin-left:8px"></span></h2>
      <table>
        <thead><tr><th>数据集</th><th>条目数</th></tr></thead>
        <tbody id="stats-body"><tr><td colspan="2" style="color:var(--muted)">加载中…</td></tr></tbody>
      </table>
      <div style="margin-top:14px">
        <button class="btn ghost" id="refresh-btn">刷新统计</button>
        <button class="btn" id="sync-btn" style="margin-left:8px">🔄 全量同步到向量库</button>
      </div>
      <div class="msg" id="sync-msg"></div>
    </div>

  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var creds = sessionStorage.getItem("admin_auth") || ""; // base64 user:pass

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {}, { "Authorization": "Basic " + creds });
    return fetch(path, opts);
  }
  function showMsg(el, text, ok) {
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
    el.style.display = "block";
  }

  // ---- 登录 ----
  $("login-btn").addEventListener("click", async function () {
    var u = $("login-user").value.trim(), p = $("login-pass").value;
    if (!u || !p) { showMsg($("login-msg"), "请输入用户名和密码", false); return; }
    creds = btoa(u + ":" + p);
    sessionStorage.setItem("admin_auth", creds);
    try {
      var resp = await api("/admin/knowledge/stats");
      if (resp.ok) { enterAdmin(); return; }
      if (resp.status === 401) { showMsg($("login-msg"), "用户名或密码错误", false); sessionStorage.removeItem("admin_auth"); creds = ""; return; }
      showMsg($("login-msg"), "服务器错误（" + resp.status + "）", false);
    } catch (e) { showMsg($("login-msg"), "无法连接服务器", false); }
  });
  $("logout-btn").addEventListener("click", function () {
    sessionStorage.removeItem("admin_auth"); creds = "";
    $("main-wrap").style.display = "none"; $("login-wrap").style.display = "block";
  });

  // ---- 上传 ----
  var drop = $("drop"), fileInput = $("file-input");
  drop.addEventListener("click", function () { fileInput.click(); });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer.files.length) fileInput.files = e.dataTransfer.files;
    fileInput.dispatchEvent(new Event("change"));
  });
  fileInput.addEventListener("change", function () {
    var f = fileInput.files[0];
    $("upload-btn").disabled = !f;
    $("upload-name").textContent = f ? f.name : "";
  });
  $("upload-btn").addEventListener("click", async function () {
    var f = fileInput.files[0];
    if (!f) return;
    var btn = $("upload-btn"); btn.disabled = true;
    var fd = new FormData();
    fd.append("file", f);
    var msgEl = $("upload-msg");
    showMsg(msgEl, "上传中：分类并写入知识库…", true);
    try {
      var resp = await api("/admin/knowledge", { method: "POST", body: fd });
      var data = await resp.json().catch(function () { return {}; });
      if (resp.ok) {
        showMsg(msgEl, "✅ " + (data.message || "更新成功"), true);
        loadStats();
      } else {
        showMsg(msgEl, "❌ " + (data.error || ("失败（" + resp.status + "）")), false);
      }
    } catch (e) { showMsg(msgEl, "❌ 网络错误", false); }
    btn.disabled = false;
  });

  // ---- 统计 ----
  async function loadStats() {
    try {
      var resp = await api("/admin/knowledge/stats");
      if (!resp.ok) throw new Error(resp.status);
      var data = await resp.json();
      var total = 0, body = $("stats-body");
      body.innerHTML = "";
      var keys = Object.keys(data.stats || {}).sort();
      if (!keys.length) { body.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">知识库为空</td></tr>'; }
      keys.forEach(function (k) {
        var n = data.stats[k]; total += n;
        var tr = document.createElement("tr");
        tr.innerHTML = '<td>' + k + '</td><td>' + n.toLocaleString() + '</td>';
        body.appendChild(tr);
      });
      $("stats-total").textContent = "（共 " + total.toLocaleString() + " 条）";
    } catch (e) {
      $("stats-body").innerHTML = '<tr><td colspan="2" style="color:var(--err)">统计加载失败</td></tr>';
    }
  }
  $("refresh-btn").addEventListener("click", loadStats);

  // ---- 全量向量同步 ----
  $("sync-btn").addEventListener("click", async function () {
    var btn = $("sync-btn"); btn.disabled = true; btn.textContent = "同步中…";
    var msgEl = $("sync-msg");
    showMsg(msgEl, "全量同步开始，大库可能需要几分钟…", true);
    try {
      var resp = await api("/admin/sync", { method: "POST", body: (function () {
        var fd = new FormData(); fd.append("full", "true"); fd.append("source", "all");
        fd.append("file", new Blob(["[]"], { type: "application/json" }), "empty.json");
        return fd;
      })() });
      var data = await resp.json().catch(function () { return {}; });
      if (resp.ok) {
        var st = data.sync || {};
        showMsg(msgEl, "✅ 同步完成：总 " + st.total_records + "，成功 " + st.synced_records + (st.errors && st.errors.length ? "，错误 " + st.errors.length : ""), true);
      } else {
        showMsg(msgEl, "❌ " + (data.error || ("失败（" + resp.status + "）")), false);
      }
    } catch (e) { showMsg(msgEl, "❌ 网络错误", false); }
    btn.disabled = false; btn.textContent = "🔄 全量同步到向量库";
  });

  function enterAdmin() {
    $("login-wrap").style.display = "none";
    $("main-wrap").style.display = "block";
    loadStats();
  }

  // 已登录则直接进入
  if (creds) {
    api("/admin/knowledge/stats").then(function (r) {
      if (r.ok) enterAdmin();
      else { sessionStorage.removeItem("admin_auth"); creds = ""; $("login-wrap").style.display = "block"; }
    }).catch(function () {
      $("login-wrap").style.display = "block";
    });
  } else {
    $("login-wrap").style.display = "block";
  }
})();
</script>
</body>
</html>
