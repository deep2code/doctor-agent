<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医答 · 轻松对话 — 循证医学AI助手</title>
<style>

  :root {
    --bg: #e6f2f1; --card: #ffffff;
    --accent: #0e7c86; --accent-dark: #0a6169; --accent-light: #e3f4f4;
    --text: #1f2937; --muted: #64748b; --border: #dbe4e6;
    --user-bubble: #0e7c86; --user-text: #ffffff; --ai-bubble: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 520px at 88% -8%, rgba(255,255,255,.95), transparent 60%),
      radial-gradient(900px 480px at -10% 108%, rgba(14,124,134,.14), transparent 55%),
      linear-gradient(165deg, #f4faf9 0%, #e6f2f1 42%, #d8eae9 100%);
    background-attachment: fixed;
    color: var(--text); display: flex; flex-direction: column; height: 100vh;
  }

  /* ---- 顶部导航栏 ---- */
  header {
    position: relative; z-index: 10;
    background: linear-gradient(92deg, #0a6b74, #0e8a94 55%, #12a2aa);
    color: #fff; border-bottom: 3px solid #f6a821;
    padding: 8px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    box-shadow: 0 3px 14px rgba(10,80,90,.28);
  }
  .hosp-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .hosp-logo { display: flex; align-items: center; gap: 8px; font-size: 24px; }
  .ecg-svg { width: 48px; height: 26px; flex-shrink: 0; }
  .ecg-path {
    stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: ecg 1.8s linear infinite;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.65));
  }
  @keyframes ecg { to { stroke-dashoffset: -220; } }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: .4px; }
  .logo span { color: #ffd76a; font-weight: 600; font-size: 13px; margin-left: 6px; }
  .subtitle { font-size: 11px; opacity: .92; margin-top: 1px; }
  #new-chat {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.45);
    color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(4px); transition: all .25s; flex-shrink: 0;
  }
  #new-chat:hover { background: #fff; color: var(--accent-dark); border-color: #fff; transform: translateY(-1px); }

  main { flex: 1; overflow-y: auto; padding: 24px 0 12px; position: relative; z-index: 1; scroll-behavior: smooth; }
  #chat { max-width: 860px; margin: 0 auto; padding: 0 20px; }

  /* ---- 欢迎页 ---- */
  #welcome { padding: 30px 10px 14px; }
  .welcome-hero h1 { font-size: 30px; font-weight: 800; color: #123f46; letter-spacing: .5px; }
  .welcome-hero p { color: var(--muted); margin-top: 9px; font-size: 15px; }
  .welcome-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 30px; align-items: start; margin-top: 26px; }
  .welcome-body {
    background: #fff; border: 1px solid var(--border); border-radius: 18px;
    padding: 16px 12px 12px; box-shadow: 0 6px 20px rgba(15,60,70,.07);
  }
  .welcome-body #welcome-body-svg .ans-body { width: 100%; max-width: 252px; margin: 0 auto; display: block; }
  .welcome-body-cap { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
  .welcome-body .pickable { cursor: pointer; }
  .welcome-body .pickable:focus-visible { outline: none; }
  .welcome-body .pickable:hover .organ,
  .welcome-body .pickable:hover .foot { fill: rgba(14,124,134,.5); stroke: #0a5f68; }
  .welcome-body .pickable:hover .limb { stroke: rgba(14,124,134,.5); }
  .welcome-body .pickable:hover .olabel { fill: #fff; font-weight: 800; }
  .welcome-body .pickable.sel .organ,
  .welcome-body .pickable.sel .foot { fill: rgba(14,124,134,.75); stroke: #0a5f68; }
  .welcome-body .pickable.sel .limb { stroke: rgba(14,124,134,.55); }
  .welcome-body .pickable.sel .olabel { fill: #fff; font-weight: 800; }
  .welcome-examples { display: flex; flex-direction: column; gap: 10px; max-width: 430px; margin: 6px auto 0; width: 100%; }
  .ex-title { font-size: 13px; color: var(--muted); }
  .ex-q {
    text-align: left; font: inherit; font-size: 14.5px; line-height: 1.6; cursor: pointer;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 16px; color: #253440; transition: border-color .18s, transform .18s;
  }
  .ex-q:hover { border-color: var(--accent); transform: translateY(-1px); }
  @media (max-width: 700px) {
    .welcome-grid { grid-template-columns: 1fr; }
    .welcome-body { max-width: 250px; margin: 0 auto; }
    .welcome-hero h1 { font-size: 24px; }
  }
  /* ---- 消息区 ---- */
  .msg { display: flex; margin: 24px 0; align-items: flex-start; animation: msgIn .45s cubic-bezier(.22,.9,.35,1.1) both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .msg.user { justify-content: flex-end; }
  .msg .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 23px;
    margin-right: 12px; position: relative;
  }
  .msg .avatar .avatar-face { filter: drop-shadow(0 1px 2px rgba(0,0,0,.16)); }
  .msg.ai .avatar {
    background: linear-gradient(145deg, #fff, #e6f4f3);
    border: 2px solid var(--accent);
    box-shadow: 0 4px 16px rgba(14,124,134,.3);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .msg.ai .avatar::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(14,124,134,.3); animation: ringPulse 2.6s ease-out infinite;
  }
  .msg.user .avatar { background: #eef2f4; border: 2px solid var(--border); }
  .msg .meta { max-width: 80%; display: flex; flex-direction: column; min-width: 0; }
  .msg.user .meta { align-items: flex-end; }
  .msg .meta .name { font-size: 13px; color: var(--muted); margin: 0 4px 6px; font-weight: 700; letter-spacing: .3px; }
  .bubble {
    max-width: 100%; padding: 16px 20px; border-radius: 18px; line-height: 1.75; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), #10939d); color: var(--user-text);
    border-top-right-radius: 6px; box-shadow: 0 6px 20px rgba(14,124,134,.35);
  }
  .msg.ai .bubble {
    background: rgba(255,255,255,.96); border: 1px solid rgba(14,124,134,.15);
    border-top-left-radius: 6px; box-shadow: 0 4px 20px rgba(14,124,134,.1);
  }
  .bubble p { margin: 8px 0; }
  .bubble ul, .bubble ol { margin: 8px 0 8px 22px; }
  .bubble h3 { font-size: 16px; margin: 12px 0 6px; font-weight: 700; }
  .bubble strong { font-weight: 700; }
  .bubble blockquote { border-left: 3px solid rgba(14,124,134,.3); color: var(--muted); padding-left: 12px; margin: 10px 0; font-size: 13px; background: rgba(14,124,134,.04); border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; text-align: left; }
  .bubble th { background: #f3f4f6; font-weight: 600; }
  .bubble pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bubble :not(pre) > code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; border-radius: 2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 医生“接诊过程”步骤卡 */
  .steps { border-bottom: 1px dashed rgba(14,124,134,.2); padding-bottom: 10px; margin-bottom: 10px; }
  .step-line {
    font-size: 12px; color: var(--accent-dark); padding: 4px 10px; line-height: 1.6;
    display: flex; align-items: center; gap: 8px; animation: stepIn .3s ease both;
    background: rgba(14,124,134,.06); border-radius: 8px; margin: 3px 0;
  }
  @keyframes stepIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

  /* ---- 底部输入区 ---- */
  footer {
    position: relative; z-index: 10;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(240,248,247,.98));
    backdrop-filter: blur(16px);
    border-top: 2px solid rgba(14,124,134,.15); padding: 16px 20px 14px; flex-shrink: 0;
    box-shadow: 0 -8px 32px rgba(10,80,90,.12);
  }
  #input-area { max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 2px solid rgba(14,124,134,.25); border-radius: 18px;
    padding: 14px 20px; font-size: 16px; font-family: inherit; line-height: 1.5; max-height: 160px;
    outline: none; background: #fbfdfd; transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 2px 8px rgba(14,124,134,.08);
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(14,124,134,.12), 0 4px 16px rgba(14,124,134,.15); }
  #send {
    background: linear-gradient(135deg, var(--accent), #0f97a0); color: #fff; border: none;
    border-radius: 16px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(14,124,134,.35); transition: all .22s;
    letter-spacing: .5px;
  }
  #send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,124,134,.45); }
  #send:disabled { background: #cbd5d5; color: #94a3a3; cursor: not-allowed; box-shadow: none; }
  #img-btn {
    background: rgba(255,255,255,.9); border: 2px solid rgba(14,124,134,.2); border-radius: 14px;
    padding: 12px 14px; cursor: pointer; flex-shrink: 0; font-size: 20px;
    display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .2s;
    box-shadow: 0 2px 8px rgba(14,124,134,.1);
  }
  #img-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  #file-input { display: none; }
  #img-preview-bar { max-width: 860px; margin: 0 auto; display: none; gap: 8px; padding: 8px 0 0; flex-wrap: wrap; }
  #img-preview-bar.has-images { display: flex; }
  .img-preview-item { position: relative; width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
  .img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .img-preview-item .img-rm {
    position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.5); color: #fff;
    border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .hint {
    display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    max-width: 860px; margin: 10px auto 0; text-align: center; font-size: 12px; color: var(--muted);
    background: rgba(246,168,33,.08); border: 1px solid rgba(246,168,33,.25);
    border-radius: 10px; padding: 6px 12px;
  }
  .version-info {
    font-size: 11px; color: var(--muted); opacity: .7;
  }

  .error-tip { color: #dc2626; font-size: 13px; text-align: center; margin-top: 6px; display: none; }

  /* ---- 对话列表侧边栏 ---- */
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
    background: rgba(255,255,255,.97); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 16px rgba(10,70,80,.08);
  }
  .sidebar-head {
    padding: 14px 16px; font-weight: 800; border-bottom: 1px solid var(--border);
    font-size: 15px; color: var(--accent-dark); background: linear-gradient(180deg, #f2faf9, #fff);
  }
  #conv-list { flex: 1; overflow-y: auto; padding: 8px; list-style: none; margin: 0; }
  #conv-list li {
    padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; transition: background .18s;
  }
  #conv-list li:hover { background: #f0f7f6; }
  #conv-list li.active { background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }
  #conv-list .conv-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #conv-list .conv-del { opacity: 0; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0 2px; }
  #conv-list li:hover .conv-del { opacity: 1; }
  #conv-list .empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 13px; }
  .sidebar-foot { padding: 10px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; display: none; }
  #menu-btn { display: none; border: none; background: none; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; color: #fff; }

  @media (min-width: 769px) {
    body { margin-left: 260px; }
  }
  @media (max-width: 768px) {
    body { margin-left: 0; }
    #sidebar { transform: translateX(-100%); transition: transform .25s; box-shadow: 2px 0 12px rgba(0,0,0,.15); }
    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: block; }
    .subtitle { display: none; }
    .bubble { max-width: 100%; }
    .msg .meta { max-width: 86%; }
    #welcome { padding: 30px 12px 20px; }
    .doctor-card { padding: 16px 22px 16px 16px; gap: 14px; }
    .doctor-avatar { width: 68px; height: 68px; }
    .avatar-inner { font-size: 34px; }
    .doctor-name { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

</style>

<style>
  /* ===== V2 诊室场景 ===== */
  :root { --doc-accent: #0e7c86; }
  #chat { max-width: 960px; }

  /* ---- 对话记录（剧本式，非气泡） ---- */
  #transcript { padding: 4px 4px 22px; }
  .line { display: flex; flex-direction: column; }
  .line + .line { margin-top: 16px; padding-top: 13px; border-top: 1px dashed rgba(14,124,134,.22); }
  .line-who { font-size: 13px; font-weight: 800; color: var(--doc-accent); display: flex; align-items: center; gap: 7px; }
  .line.user .line-who { color: #475569; }
  .line-role { font-size: 11px; font-weight: 500; color: #94a3b8; background: #eef2f4; padding: 1px 8px; border-radius: 8px; }
  .line-say { margin-top: 5px; font-size: 15px; line-height: 1.75; color: #253440; word-break: break-word; }
  .line-say p { margin: 6px 0; }
  .line-say ul, .line-say ol { margin: 6px 0 6px 22px; }
  .line-say h3, .line-say h4 { font-size: 15px; margin: 10px 0 4px; }
  .line-say strong { font-weight: 600; }
  .line-say blockquote { border-left: 3px solid var(--border); color: var(--muted); padding-left: 10px; margin: 8px 0; font-size: 13px; }
  .line-say table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .line-say th, .line-say td { border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; text-align: left; }
  .line-say th { background: #f3f4f6; font-weight: 600; }
  .line-say pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .line-say code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .line-say :not(pre) > code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .line-say a { color: var(--accent); text-decoration: none; }
  .line-say a:hover { text-decoration: underline; }
  .line-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .line-steps .stp {
    font-size: 11px; color: #0f6b74; background: #e8f6f5; border: 1px solid #cfe9e7;
    border-radius: 10px; padding: 2px 9px; animation: stepIn .3s ease both;
  }

  /* ---- 回答展示：结论横幅 + 图文并行 + 折叠抽屉 ---- */
  .line.ai .line-say {
    background: #fff; border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px 12px; box-shadow: 0 4px 16px rgba(15,60,70,.06);
  }
  .ans-banner {
    position: relative; margin: 4px 0 12px; padding: 14px 18px 15px;
    border-radius: 14px; overflow: hidden;
    background: linear-gradient(118deg, #0a5f68 0%, #0e7c86 74%, #14939b 100%);
    color: #fff; box-shadow: 0 10px 24px rgba(10,95,104,.28);
  }
  .ans-banner::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #f6a821, #ffd270);
  }
  .ans-banner-cap {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,.82); margin-bottom: 5px;
  }
  .ans-banner-body { font-size: 19px; line-height: 1.72; font-weight: 600; }
  .ans-banner-body p { margin: 0; }
  .ans-banner-body strong { color: #ffe1a3; font-weight: 800; }

  .ans-grid { display: grid; grid-template-columns: minmax(0, 1fr) 188px; gap: 14px; align-items: start; }
  .ans-main { min-width: 0; font-size: 15.5px; line-height: 1.85; color: #253440; }
  .ans-main p { margin: 9px 0; }
  .ans-main ul, .ans-main ol { margin: 9px 0 9px 4px; padding-left: 20px; }
  .ans-main li { margin: 5px 0; }
  .ans-main h3, .ans-main h4 { font-size: 16px; margin: 14px 0 6px; color: #0a5f68; }
  .ans-main strong { font-weight: 700; color: #0a4a52; }
  .ans-main blockquote { border-left: 3px solid var(--accent-light); color: var(--muted); padding-left: 12px; margin: 9px 0; font-size: 13.5px; }
  .ans-main table { border-collapse: collapse; margin: 10px 0; width: 100%; }
  .ans-main th, .ans-main td { border: 1px solid var(--border); padding: 7px 10px; font-size: 14px; text-align: left; }
  .ans-main th { background: #f0f7f6; font-weight: 700; }
  .ans-main pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 9px 0; }
  .ans-main code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ans-main :not(pre) > code { background: #f0f7f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .ans-main a { color: var(--accent); text-decoration: none; }
  .ans-main a:hover { text-decoration: underline; }
  /* 右栏图形：人体图 / 流程图 */
  .ans-media {
    background: var(--accent-light); border: 1px solid rgba(14,124,134,.18);
    border-radius: 14px; padding: 10px 8px 8px; text-align: center;
  }
  .ans-media .bm-face { max-width: 168px; margin: 0 auto; }
  .ans-media .ans-body { max-width: 196px; margin: 0 auto; display: block; }
  .ans-media-cap { font-size: 11.5px; color: var(--accent-dark); margin-top: 4px; font-weight: 600; }
  .ans-media svg:not(.bm-face) { max-width: 100%; height: auto; }
  .ans-media .mermaid-svg, .ans-media > svg { background: #fff; border-radius: 10px; }
  /* 解剖插画：器官常显（浅）+ 命中高亮（teal） */
  .ans-body .silhouette { fill: #f4fafa; stroke: #d5e7e8; stroke-width: 1.5; }
  .ans-body .limb { fill: none; stroke: #e3eff0; stroke-linecap: round; }
  .ans-body .limb.on { stroke: rgba(14,124,134,.32); }
  .ans-body .foot { fill: #e3eff0; }
  .ans-body .foot.on { fill: rgba(14,124,134,.32); }
  .ans-body .organ { fill: #c6dcdf; stroke: #b0cccf; stroke-width: 1; transition: fill .18s, stroke .18s; }
  .ans-body .organ.on { fill: rgba(14,124,134,.72); stroke: #0a5f68; }
  .ans-body .organ.back { fill: rgba(198,220,223,.45); stroke-dasharray: 3 2; }
  .ans-body .organ.back.on { fill: rgba(14,124,134,.4); stroke-dasharray: 3 2; stroke: #0a5f68; }
  .ans-body .vessel { fill: #c6dcdf; stroke: #b0cccf; stroke-width: 1; }
  .ans-body .vessel.on { fill: rgba(14,124,134,.6); stroke: #0a5f68; }
  .ans-body .organ-line { fill: none; stroke: #b0cccf; stroke-width: 1.2; }
  .ans-body .organ-line.on { stroke: rgba(255,255,255,.75); }
  .ans-body .organ-line2 { fill: none; stroke: #b0cccf; stroke-width: 1.5; }
  .ans-body .organ-line2.on { stroke: rgba(14,124,134,.72); }
  .ans-body .organ2 { fill: none; stroke: #b0cccf; stroke-width: 1.5; }
  .ans-body .organ2.on { stroke: rgba(14,124,134,.72); stroke-width: 2; }
  .ans-body .ureter { fill: none; stroke: #b0cccf; stroke-width: 2; stroke-dasharray: 3 3; }
  .ans-body .ureter.on { stroke: rgba(14,124,134,.6); }
  .ans-body .bone { fill: none; stroke: #cfe0e2; stroke-width: 2.5; stroke-linecap: round; }
  .ans-body .olabel { font-size: 14px; fill: #5b8288; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
  .ans-body .olabel.on { fill: #fff; font-weight: 800; }
  .ans-body .olabel.side { font-size: 12px; fill: #7fa0a5; }
  .ans-body .olabel.side.on { fill: #0a5f68; }
  .ans-body .lead { stroke: #c3d9db; stroke-width: 1; }
  .ans-body .lead.on { stroke: #0a5f68; }
  /* 人体图高亮部位（复用 bm-region 结构，答案侧配色） */
  .ans-media .bm-region { pointer-events: none; }
  .ans-media .bm-region>rect, .ans-media .bm-region>ellipse, .ans-media .bm-region>circle {
    fill: rgba(14,124,134,0); transition: fill .18s;
  }
  .ans-media .bm-region>.bm-stroke { stroke: rgba(14,124,134,0); transition: stroke .18s; }
  .ans-media .bm-region.is-hit>rect, .ans-media .bm-region.is-hit>ellipse, .ans-media .bm-region.is-hit>circle { fill: rgba(14,124,134,.55); }
  .ans-media .bm-region.is-hit>.bm-stroke { stroke: rgba(14,124,134,.6); }
  .ans-media .bm-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; margin-top: 8px; }
  .ans-media .bm-tag {
    font-size: 11px; font-weight: 700; color: #0a5f68;
    background: #fff; border: 1px solid rgba(14,124,134,.3);
    border-radius: 999px; padding: 2px 9px;
  }
  /* 折叠抽屉：专业描述 / 参考引用 */
  .ans-drawer { border: 1px solid var(--border); border-radius: 12px; margin-top: 10px; background: #fbfdfd; }
  .ans-drawer + .ans-drawer { margin-top: 8px; }
  .ans-drawer-toggle {
    width: 100%; display: flex; align-items: center; gap: 7px; border: 0; background: transparent;
    font: inherit; font-size: 13.5px; font-weight: 700; color: var(--muted);
    padding: 10px 14px; cursor: pointer; text-align: left;
  }
  .ans-drawer-toggle .chev { margin-left: auto; transition: transform .2s; font-size: 11px; }
  .ans-drawer.open .ans-drawer-toggle .chev { transform: rotate(90deg); }
  .ans-drawer-toggle:hover { color: var(--accent-dark); }
  .ans-drawer-body { display: none; padding: 2px 16px 12px; font-size: 14px; line-height: 1.8; color: #33495a; }
  .ans-drawer.open .ans-drawer-body { display: block; }
  .ans-drawer.prof .ans-drawer-body h3, .ans-drawer.prof .ans-drawer-body h4 { font-size: 14.5px; color: #5b54b8; }
  .ans-drawer.refs { background: #f8fafc; }
  .ans-drawer.refs .ans-drawer-body { font-size: 12.5px; color: #475569; }
  @media (max-width: 700px) {
    .ans-grid { grid-template-columns: 1fr; }
    .ans-media { max-width: 240px; margin: 0 auto; }
    .ans-banner-body { font-size: 17.5px; }
  }

  @media (max-width: 768px) {
    #chat { padding: 0 12px; }
  }
 { margin: 0 -12px 14px; height: 240px; }
    .scene-window { width: 96px; right: 8px; }
    .scene-monitor { width: 82px; left: 8px; top: 14px; }
    .scene-plant { left: 96px; font-size: 30px; }
    .speech { width: 82%; bottom: 36px; }
    .speech-text { max-height: 76px; font-size: 13.5px; }
    .char-name { font-size: 12px; }
    .panel-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<aside id="sidebar">
  <div class="sidebar-head">历史对话</div>
  <ul id="conv-list"></ul>
</aside>
<div id="mask"></div>

<header>
  <button id="menu-btn">☰</button>
  <div class="hosp-brand"><div class="logo">医答</div></div>
  <button id="new-chat">新对话</button>
</header>

<main id="scroll-area">
  <div id="chat">

    <div id="welcome">
      <div class="welcome-hero">
        <h1>今天哪里不舒服？</h1>
        <p>直接描述症状，或点旁边人体图选择部位，我会给出有依据的解答。</p>
      </div>
      <div class="welcome-grid">
        <div class="welcome-body">
          <div id="welcome-body-svg"></div>
          <div class="welcome-body-cap">点击器官或肢体选中，再点一次取消</div>
        </div>
        <div class="welcome-side">
          <div class="welcome-examples">
            <div class="ex-title">可以这样问</div>
            <button type="button" class="ex-q">我一喝牛奶就拉肚子，是乳糖不耐受吗？</button>
            <button type="button" class="ex-q">孩子发烧 38.9°C，要马上去医院吗？</button>
            <button type="button" class="ex-q">体检发现甲状腺结节，接下来该怎么办？</button>
          </div>
        </div>
      </div>
    </div>

    <div id="transcript"></div>
  </div>
</main>

<footer>
  <div id="body-pick-bar" hidden>
    <span class="pick-chip">📍 不适部位：<b id="body-pick-name"></b>
      <button type="button" id="body-pick-clear" aria-label="取消选择">✕</button></span>
  </div>
    <div id="input-area">
        <button id="img-btn" title="上传检查图片（X光/CT/化验单等）">📷</button>
    <input type="file" id="file-input" accept="image/jpeg,image/png,image/gif,image/webp" multiple />
    <textarea id="input" rows="1" placeholder="描述您的症状，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div id="img-preview-bar"></div>

  function splitSections(md) {

    var hRe = /^(#{1,4})\s+(.*?)\s*#*\s*$/;
    var bRe = /^\*\*(.+?)\*\*\s*[:：]?\s*$/;
    lines.forEach(function (l) {
      var m = l.match(hRe) || l.match(bRe);

    sections.forEach(function (s) {
      var t = (s.title || "").toLowerCase();

      summary: [{ title: null, content: summary }],
      detail: [{ title: null, content: detail }],
      prof: [{ title: null, content: prof }],
      refs: [{ title: null, content: refs.join("\n") }]

  }

    s += wrap("kidneys", '<path class="organ back' + cls("kidneys") + '" d="M322,296 C332,292 340,300 340,314 C340,328 330,338 320,334 C312,330 310,318 313,306 C315,300 318,297 322,296 Z"/><path class="ureter' + cls("kidneys") + '" d="M320,336 C308,376 286,426 252,468"/>', [326, 316, 16]);

    s += wrap("colon", '<path class="organ2' + cls("colon") + '" d="M186,362 C220,378 266,380 300,362 C308,358 316,360 318,368 C318,376 310,382 300,380 C268,394 222,392 192,378 C182,374 180,366 186,362 Z"/>', [244, 372, 34]);
    s += wrap("colon", '<path class="organ2' + cls("colon") + '" d="M302,372 C308,396 310,424 306,446 C304,456 294,458 290,450 C284,428 286,398 288,378 C289,370 298,364 302,372 Z"/><path class="organ-line' + cls("colon") + '" d="M292,392 L302,390 M294,412 L304,410 M296,432 L306,430"/>', [298, 410, 18]);
    s += wrap("colon", '<path class="organ2' + cls("colon") + '" d="M304,452 C310,470 300,484 284,482 C270,480 264,468 272,458 C280,448 298,446 306,452 Z"/>', [288, 468, 18]);
    s += '<text class="olabel side' + cls("colon") + '" x="118" y="404">升结肠</text>';
    s += '<line class="lead' + cls("colon") + '" x1="126" y1="406" x2="148" y2="408"/>';
    s += '<text class="olabel side' + cls("colon") + '" x="342" y="404">降结肠</text>';
    s += '<line class="lead' + cls("colon") + '" x1="338" y1="406" x2="314" y2="408"/>';
    /* 小肠 */
    s += wrap("intestine", '<path class="organ2' + cls("intestine") + '" d="M196,394 C226,384 258,390 260,408 C262,424 232,430 216,422 C204,416 206,404 218,400 M210,438 C240,448 274,440 276,418 C277,402 262,394 252,398 M226,452 C252,460 280,450 282,430" style="stroke-width:11"/>', [240, 420, 42]);
    s += '<text class="olabel' + cls("intestine") + '" x="238" y="424">小肠</text>';
    /* 阑尾 */
    s += wrap("appendix", '<path class="organ2' + cls("appendix") + '" d="M168,452 C162,462 166,472 176,474" style="stroke-width:8"/>', [170, 462, 12]);
    s += '<text class="olabel side' + cls("appendix") + '" x="164" y="496">阑尾</text>';
    s += '<line class="lead' + cls("appendix") + '" x1="172" y1="478" x2="166" y2="486"/>';
    /* 膀胱 */
    s += wrap("bladder", '<path class="organ' + cls("bladder") + '" d="M206,480 C206,468 216,462 230,462 C244,462 254,468 254,480 C254,490 244,496 230,496 C216,496 206,490 206,480 Z"/>', [230, 479, 15]);
    s += '<text class="olabel side' + cls("bladder") + '" x="286" y="500">膀胱</text>';
    s += '<line class="lead' + cls("bladder") + '" x1="256" y1="482" x2="270" y2="496"/>';
    s += '</svg>';
    if (opts.interactive) return s;
    var tags = (hits || "").split(",").filter(function (p) { return p; })
      .map(function (p) { return '<span class="bm-tag">' + (BODY_UNITS[p] || p) + "</span>"; }).join("");
    return s + '<div class="bm-tags">' + tags + '</div><div class="ans-media-cap">相关器官与部位</div>';
  }
  function bodyFigure(hitParts) {
    if (!hitParts) return "";
    return ansBodySVG(hitParts);
  }

  /* ---- 欢迎屏：点选人体部位 -> 引用提问 ---- */
  var bodyPick = "";
  function renderWelcomeBody() {
    var el = document.getElementById("welcome-body-svg");
    if (el) el.innerHTML = ansBodySVG(bodyPick, { interactive: true });
  }
  function updatePickBar() {
    var bar = document.getElementById("body-pick-bar");
    if (!bar) return;
    if (bodyPick) {
      bar.hidden = false;
      document.getElementById("body-pick-name").textContent = BODY_UNITS[bodyPick] || bodyPick;
    } else {
      bar.hidden = true;
    }
  }
  function setBodyPick(unit) {
    bodyPick = (bodyPick === unit) ? "" : unit;
    renderWelcomeBody();
    updatePickBar();
    if (bodyPick && typeof input !== "undefined" && input) input.focus();
  }
  function clearBodyPick() {
    if (!bodyPick) return;
    bodyPick = "";
    renderWelcomeBody();
    updatePickBar();
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest("#welcome-body-svg .pickable") : null;
    if (t) setBodyPick(t.getAttribute("data-unit"));
    var ex = e.target.closest ? e.target.closest(".ex-q") : null;
    if (ex && typeof input !== "undefined" && input && typeof send === "function") {
      input.value = ex.textContent;
      send();
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target && e.target.closest ? e.target.closest("#welcome-body-svg .pickable") : null;
    if (t) { e.preventDefault(); setBodyPick(t.getAttribute("data-unit")); }
  });
  var pickClearBtn = document.getElementById("body-pick-clear");
  if (pickClearBtn) pickClearBtn.addEventListener("click", clearBodyPick);
  renderWelcomeBody();

  var convsCache = [];
  function titleOf(items) {
    for (var i = 0; i < items.length; i++) if (items[i].role === "user") return items[i].text.slice(0, 20);
    return "新对话";
  }
  function currentConv(convs) {
    for (var i = 0; i < convs.length; i++) if (convs[i].id === state.convId) return convs[i];
    return null;
  }
  async function loadConvs() {
    try {
      var resp = await fetch("/sessions", { headers: { "Content-Type": "application/json" } });
      if (!resp.ok) { convsCache = []; return convsCache; }
      var data = await resp.json();
      convsCache = (data && data.sessions) ? data.sessions : [];
    } catch (e) { convsCache = []; }
    return convsCache;
  }
  function saveConvs() {}
  async function loadSession(id) {
    var resp = await fetch("/sessions/" + encodeURIComponent(id));
    if (!resp.ok) throw new Error("加载对话失败（" + resp.status + "）");
    return await resp.json();
  }
  async function apiDeleteConv(id) {
    var resp = await fetch("/sessions/" + encodeURIComponent(id), { method: "DELETE" });
    if (!resp.ok) throw new Error("删除失败（" + resp.status + "）");
  }
  async function saveHistory() {
    await loadConvs();
    renderConvList();
  }
  function replayMessages(messages) {
    transcript.innerHTML = "";
    messages.forEach(function (it) { addLine(it.role, it.content); });
    renderMermaid(transcript);
    if (messages.length) {
      var last = messages[messages.length - 1];
      setSpeech(last.role === "user" ? "user" : "ai", plainText(last.content || ""));
    }
  }
  async function restoreHistory() {
    await loadConvs();
    renderConvList();
    if (state.convId) {
      try {
        var c = await loadSession(state.convId);
        if (c && c.messages && c.messages.length) {
          welcomeEl.style.display = "none";
          replayMessages(c.messages);
        }
      } catch (e) {}
    }
  }
  function renderConvList() {
    var ul = $("conv-list");
    ul.innerHTML = "";
    if (!convsCache.length) {       ul.innerHTML = '<li class="empty">暂无历史对话<br>开始新的对话</li>'; return; }
    convsCache.forEach(function (c) {
      var li = document.createElement("li");
      if (c.id === state.convId) li.className = "active";
      var title = document.createElement("span");
      title.className = "conv-title";
      title.textContent = c.title || "新对话";
      title.addEventListener("click", function () { switchConv(c.id); });
      var del = document.createElement("button");
      del.className = "conv-del";
      del.textContent = "✕";
      del.title = "删除该对话";
      del.addEventListener("click", function (e) { e.stopPropagation(); deleteConv(c.id); });
      li.appendChild(title); li.appendChild(del);
      ul.appendChild(li);
    });
  }
  async function switchConv(id) {
    state.convId = id;
    transcript.innerHTML = "";
    try {
      var c = await loadSession(id);
      if (c && c.messages && c.messages.length) {
        welcomeEl.style.display = "none";
        replayMessages(c.messages);
      } else {
        welcomeEl.style.display = "";
      }
    } catch (e) {
      welcomeEl.style.display = "";
      showError("⚠️ " + e.message);
    }
    renderConvList();
    closeAll();
  }
  async function deleteConv(id) {
    try { await apiDeleteConv(id); } catch (e) { showError("⚠️ " + e.message); }
    if (state.convId === id) {
      state.convId = "";
      transcript.innerHTML = "";
      welcomeEl.style.display = "";
      setSpeech("ai", "您好，我是" + persona.name + "。有什么健康问题想了解？");
    }
    await loadConvs();
    renderConvList();
  }
  function newConv() {
    state.convId = genId();
    transcript.innerHTML = "";
    welcomeEl.style.display = "";
    clearBodyPick();
    renderConvList();
    closeAll();
  }
  function openSidebar() { $("sidebar").classList.add("open"); $("mask").style.display = "block"; }
  function closeSidebar() { $("sidebar").classList.remove("open"); $("mask").style.display = "none"; }
  function closeAll() {
    closeSidebar();
  }

  /* ================= SSE ================= */
  function parseSSE(buf, handlers) {
    var blocks = buf.split("\n\n");
    var rest = blocks.pop();
    blocks.forEach(function (block) {
      var event = "message", data = "";
      block.split("\n").forEach(function (line) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      });
      if (handlers[event]) handlers[event](data);
    });
    return rest;
  }

  async function send() {
    var text = input.value.trim();
    var hasImages = pendingImages.length > 0;
    if ((!text && !hasImages) || state.sending) return;
    clearError();

    if (!state.convId) state.convId = genId();
    input.value = ""; autoResize();

    var apiImages = [];
    if (hasImages) {
      pendingImages.forEach(function (img) { apiImages.push({ base64_data: img.base64, media_type: img.mediaType }); });
      pendingImages = [];
      renderPreviews();
    }

    var rawText = text;
    if (bodyPick) {
      var bpName = BODY_UNITS[bodyPick] || bodyPick;
      text = text ? ("【不适部位：" + bpName + "】" + text)
                  : ("【不适部位：" + bpName + "】请帮我分析可能的原因和注意事项。");
      clearBodyPick();
    }

    addLine("user", text, apiImages);
    setSpeech("user", rawText || "（上传了检查图片）");

    var line = document.createElement("div");
    line.className = "line ai";
    var who = document.createElement("div");
    who.className = "line-who";
    who.innerHTML = persona.name + ' <span class="line-role">AI 助手</span>';
    var stepsWrap = document.createElement("div");
    stepsWrap.className = "line-steps";
    var say = document.createElement("div");
    say.className = "line-say";
    var cursor = document.createElement("span");
    cursor.className = "cursor";
    say.appendChild(cursor);
    line.appendChild(who); line.appendChild(stepsWrap); line.appendChild(say);
    transcript.appendChild(line);

    var STEP_TEXT = {
      emergency: "🚨 识别到紧急情况，需立即就医",
      refuse: "🚫 这个问题超出了我的能力范围",
      retrieve: "🔍 正在查阅循证医学资料",
      tool_call: "🛠️ 正在调用医学工具分析",
      tool_result: "✅ 参考资料已就绪",
      generate: "✍️ 正在组织通俗易懂的回答",
      verify: "🛡️ 正在校验引用与安全性"
    };
    function addStep(ev) {
      var chip = document.createElement("span");
      chip.className = "stp";
      chip.textContent = STEP_TEXT[ev.type] || ("· " + (ev.summary || ""));
      stepsWrap.appendChild(chip);
      setDocStatus(STEP_TEXT[ev.type] || ev.summary || "");
      scrollToBottom();
    }

    setSending(true);
    var full = "";
    try {
      var resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text || "请分析上传的图片", conversation_id: state.convId, images: apiImages.length ? apiImages : undefined })
      });
      if (!resp.ok) {
        if (resp.status === 401) throw new Error("服务端开启了 API Key 鉴权，请先设置后再访问");
        throw new Error("请求失败（" + resp.status + "）");
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        buf = parseSSE(buf, {
          delta: function (d) {
            try { full += JSON.parse(d).text || ""; } catch (e) {}
            say.innerHTML = renderAnswer(full);
            say.appendChild(cursor);
            setSpeech("ai", plainText(full) + " ▌");
            scrollToBottom();
          },
          step: function (d) { try { addStep(JSON.parse(d)); } catch (e) {} },
          done: function (d) {
            try {
              var obj = JSON.parse(d);
              if (!full && obj.reply) full = obj.reply;
            } catch (e) {}
          },
          error: function (d) {
            var msg = "处理出错";
            try { msg = JSON.parse(d).error || msg; } catch (e) {}
            throw new Error(msg);
          }
        });
      }
      if (!full) {
        parseSSE(buf, {});
        full = say.textContent;
      }
      if (cursor.parentNode === say) say.removeChild(cursor);
      if (full) say.innerHTML = renderAnswer(full);
      else say.textContent = "（无响应）";
      renderMermaid(say);
      setSpeech("ai", plainText(full) || "（无响应）");
      saveHistory();
    } catch (e) {
      if (cursor.parentNode === say) say.removeChild(cursor);
      say.textContent = "";
      showError("⚠️ " + e.message);
    } finally {
      setSending(false);
      setDocStatus("");
      input.focus();
    }
  }

  /* ================= 事件 ================= */
  transcript.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target.closest(".ans-drawer-toggle") : null;
    if (t && t.parentNode) t.parentNode.classList.toggle("open");
  });
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", autoResize);
  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }

  $("new-chat").addEventListener("click", newConv);
("click", newConv);
  $("menu-btn").addEventListener("click", openSidebar);
  $("mask").addEventListener("click", closeAll);

  /* mermaid lazy-load (2.7MB) */
  var _mermaidLoaded = false;
  function loadMermaid(cb) {
    if (_mermaidLoaded) { cb && cb(); return; }
    var s = document.createElement("script");
    s.src = "/mermaid.min.js";
    s.onload = function () {
      _mermaidLoaded = true;
      if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });
      cb && cb();
    };
    document.head.appendChild(s);
  }

  /* ================= 启动 ================= */
  renderWelcomeBody();
  restoreHistory();
  var _q = new URLSearchParams(location.search).get('q');
  if (_q) { input.value = _q; autoResize(); }
  input.focus();
})();
</script>
</body>
