<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医答 · 轻松对话 — 循证医学AI助手</title>
<style>

  :root {
    --bg: #e6f2f1; --card: #ffffff;
    --accent: #0e7c86; --accent-dark: #0a6169; --accent-light: #e3f4f4;
    --text: #1f2937; --muted: #64748b; --border: #dbe4e6;
    --user-bubble: #0e7c86; --user-text: #ffffff; --ai-bubble: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 520px at 88% -8%, rgba(255,255,255,.95), transparent 60%),
      radial-gradient(900px 480px at -10% 108%, rgba(14,124,134,.14), transparent 55%),
      radial-gradient(700px 380px at 50% 120%, rgba(246,168,33,.06), transparent 60%),
      linear-gradient(165deg, #f4faf9 0%, #e6f2f1 42%, #d8eae9 100%);
    background-attachment: fixed;
    color: var(--text); display: flex; flex-direction: column; height: 100vh;
  }
  /* 极淡的网格纹理 */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
    background-image:
      linear-gradient(rgba(14,124,134,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(14,124,134,.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  /* 漂浮气泡粒子 */
  .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bg-particles span {
    position: absolute; bottom: -26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25));
    box-shadow: 0 0 6px rgba(255,255,255,.45); opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: .85; }
    90% { opacity: .45; }
    100% { transform: translateY(-108vh) translateX(16px); opacity: 0; }
  }

  /* ---- 顶部导航栏 ---- */
  header {
    position: relative; z-index: 10;
    background: linear-gradient(92deg, #0a6b74, #0e8a94 55%, #12a2aa);
    color: #fff; border-bottom: 3px solid #f6a821;
    padding: 8px 20px; display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    box-shadow: 0 3px 14px rgba(10,80,90,.28);
  }
  .hosp-brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .hosp-logo { display: flex; align-items: center; gap: 8px; font-size: 24px; }
  .ecg-svg { width: 48px; height: 26px; flex-shrink: 0; }
  .ecg-path {
    stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 220; stroke-dashoffset: 220;
    animation: ecg 1.8s linear infinite;
    filter: drop-shadow(0 0 3px rgba(255,255,255,.65));
  }
  @keyframes ecg { to { stroke-dashoffset: -220; } }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: .4px; }
  .logo span { color: #ffd76a; font-weight: 600; font-size: 13px; margin-left: 6px; }
  .subtitle { font-size: 11px; opacity: .92; margin-top: 1px; }
  #new-chat {
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.45);
    color: #fff; border-radius: 20px; padding: 6px 14px; font-size: 12px;
    cursor: pointer; backdrop-filter: blur(4px); transition: all .25s; flex-shrink: 0;
  }
  #new-chat:hover { background: #fff; color: var(--accent-dark); border-color: #fff; transform: translateY(-1px); }

  main { flex: 1; overflow-y: auto; padding: 24px 0 12px; position: relative; z-index: 1; scroll-behavior: smooth; }
  #chat { max-width: 860px; margin: 0 auto; padding: 0 20px; }

  /* ---- 欢迎页 ---- */
  #welcome { text-align: center; padding: 32px 20px 20px; }
  .doctor-card {
    display: inline-flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,.94); border: 1px solid rgba(14,124,134,.15);
    border-radius: 20px; padding: 18px 32px 18px 20px;
    box-shadow: 0 12px 32px rgba(15,80,90,.12);
    animation: cardIn .6s cubic-bezier(.22,.9,.35,1.12) both;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
  .doctor-avatar { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
  .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(14,124,134,.3); animation: ringPulse 2.4s ease-out infinite; }
  .avatar-inner {
    position: absolute; inset: 4px; border-radius: 50%;
    background: linear-gradient(145deg, #ffffff, #dff2f1);
    border: 2px solid var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 38px;
    box-shadow: inset 0 -6px 14px rgba(14,124,134,.15), 0 6px 16px rgba(14,124,134,.22);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes ringPulse { 0% { transform: scale(.95); opacity: 1; } 100% { transform: scale(1.34); opacity: 0; } }
  .online-dot { position: absolute; right: 2px; bottom: 2px; width: 14px; height: 14px; border-radius: 50%; background: #22c55e; border: 2px solid #fff; z-index: 2; }
  .online-dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid rgba(34,197,94,.5); animation: ringPulse 1.8s ease-out infinite; }
  .doctor-info { text-align: left; }
  .doctor-name { font-size: 20px; font-weight: 800; }
  .dept {
    font-size: 12px; color: var(--accent-dark); background: var(--accent-light);
    display: inline-block; padding: 3px 10px; border-radius: 10px; margin: 6px 0; font-weight: 600;
  }
  .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .pulse-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: blink 1.2s infinite; }
  .consult-tip {
    margin: 16px auto 4px; max-width: 520px; font-size: 13px; color: var(--muted); line-height: 1.8;
    background: rgba(255,255,255,.7); border: 1px dashed rgba(14,124,134,.3);
    border-radius: 12px; padding: 10px 18px; backdrop-filter: blur(4px);
    animation: cardIn .6s .12s both;
  }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }
  .suggestions .chip-group {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
    animation: chipFade .5s ease;
  }
  @keyframes chipFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .suggestions .dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .suggestions .dots span { width: 7px; height: 7px; border-radius: 50%; background: rgba(14,124,134,.22); cursor: pointer; transition: background .2s; }
  .suggestions .dots span.on { background: var(--accent); }
  .chip {
    background: rgba(255,255,255,.94); border: 1px solid rgba(14,124,134,.25); color: var(--text);
    border-radius: 20px; padding: 10px 16px; font-size: 13px; cursor: pointer; max-width: 340px;
    box-shadow: 0 2px 8px rgba(15,80,90,.06); transition: all .22s;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-dark); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(14,124,134,.15); }

  /* ---- 消息区 ---- */
  .msg { display: flex; margin: 24px 0; align-items: flex-start; animation: msgIn .45s cubic-bezier(.22,.9,.35,1.1) both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .msg.user { justify-content: flex-end; }
  .msg .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 23px;
    margin-right: 12px; position: relative;
  }
  .msg .avatar .avatar-face { filter: drop-shadow(0 1px 2px rgba(0,0,0,.16)); }
  .msg.ai .avatar {
    background: linear-gradient(145deg, #fff, #e6f4f3);
    border: 2px solid var(--accent);
    box-shadow: 0 4px 16px rgba(14,124,134,.3);
    animation: breathe 3.4s ease-in-out infinite;
  }
  .msg.ai .avatar::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(14,124,134,.3); animation: ringPulse 2.6s ease-out infinite;
  }
  .msg.user .avatar { background: #eef2f4; border: 2px solid var(--border); }
  .msg .meta { max-width: 80%; display: flex; flex-direction: column; min-width: 0; }
  .msg.user .meta { align-items: flex-end; }
  .msg .meta .name { font-size: 13px; color: var(--muted); margin: 0 4px 6px; font-weight: 700; letter-spacing: .3px; }
  .bubble {
    max-width: 100%; padding: 16px 20px; border-radius: 18px; line-height: 1.75; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, var(--accent), #10939d); color: var(--user-text);
    border-top-right-radius: 6px; box-shadow: 0 6px 20px rgba(14,124,134,.35);
  }
  .msg.ai .bubble {
    background: rgba(255,255,255,.96); border: 1px solid rgba(14,124,134,.15);
    border-top-left-radius: 6px; box-shadow: 0 4px 20px rgba(14,124,134,.1);
  }
  .bubble p { margin: 8px 0; }
  .bubble ul, .bubble ol { margin: 8px 0 8px 22px; }
  .bubble h3 { font-size: 16px; margin: 12px 0 6px; font-weight: 700; }
  .bubble strong { font-weight: 700; }
  .bubble blockquote { border-left: 3px solid rgba(14,124,134,.3); color: var(--muted); padding-left: 12px; margin: 10px 0; font-size: 13px; background: rgba(14,124,134,.04); border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; text-align: left; }
  .bubble th { background: #f3f4f6; font-weight: 600; }
  .bubble pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .bubble code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .bubble :not(pre) > code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .bubble a { color: var(--accent); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; border-radius: 2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 医生“接诊过程”步骤卡 */
  .steps { border-bottom: 1px dashed rgba(14,124,134,.2); padding-bottom: 10px; margin-bottom: 10px; }
  .step-line {
    font-size: 12px; color: var(--accent-dark); padding: 4px 10px; line-height: 1.6;
    display: flex; align-items: center; gap: 8px; animation: stepIn .3s ease both;
    background: rgba(14,124,134,.06); border-radius: 8px; margin: 3px 0;
  }
  @keyframes stepIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

  /* ---- 底部输入区 ---- */
  footer {
    position: relative; z-index: 10;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(240,248,247,.98));
    backdrop-filter: blur(16px);
    border-top: 2px solid rgba(14,124,134,.15); padding: 16px 20px 14px; flex-shrink: 0;
    box-shadow: 0 -8px 32px rgba(10,80,90,.12);
  }
  #input-area { max-width: 860px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 2px solid rgba(14,124,134,.25); border-radius: 18px;
    padding: 14px 20px; font-size: 16px; font-family: inherit; line-height: 1.5; max-height: 160px;
    outline: none; background: #fbfdfd; transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 2px 8px rgba(14,124,134,.08);
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(14,124,134,.12), 0 4px 16px rgba(14,124,134,.15); }
  #send {
    background: linear-gradient(135deg, var(--accent), #0f97a0); color: #fff; border: none;
    border-radius: 16px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(14,124,134,.35); transition: all .22s;
    letter-spacing: .5px;
  }
  #send:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(14,124,134,.45); }
  #send:disabled { background: #cbd5d5; color: #94a3a3; cursor: not-allowed; box-shadow: none; }
  #img-btn {
    background: rgba(255,255,255,.9); border: 2px solid rgba(14,124,134,.2); border-radius: 14px;
    padding: 12px 14px; cursor: pointer; flex-shrink: 0; font-size: 20px;
    display: flex; align-items: center; justify-content: center; color: var(--muted); transition: all .2s;
    box-shadow: 0 2px 8px rgba(14,124,134,.1);
  }
  #img-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  #file-input { display: none; }
  #img-preview-bar { max-width: 860px; margin: 0 auto; display: none; gap: 8px; padding: 8px 0 0; flex-wrap: wrap; }
  #img-preview-bar.has-images { display: flex; }
  .img-preview-item { position: relative; width: 72px; height: 72px; border-radius: 8px; border: 1px solid var(--border); overflow: hidden; flex-shrink: 0; }
  .img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .img-preview-item .img-rm {
    position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.5); color: #fff;
    border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .hint {
    max-width: 860px; margin: 10px auto 0; text-align: center; font-size: 12px; color: var(--muted);
    background: rgba(246,168,33,.08); border: 1px solid rgba(246,168,33,.25);
    border-radius: 10px; padding: 6px 12px;
  }

  /* body-map palette shim: chat UI uses --accent teal, body-map CSS expects landing vars */
  #bm-panel,#bm-toggle{--blue:var(--accent);--blue-dark:var(--accent-dark);--blue-soft:var(--accent-light);--line:var(--border);--ink:var(--text);--bg-soft:var(--accent-light);--white:var(--card);--radius:14px;}

  /* ---------- Body map ---------- */
  .bm-wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:start;margin-top:12px;}
  .bm-panel{background:var(--bg-soft);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .bm-controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .bm-seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px;}
  .bm-opt{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--text);padding:5px 14px;border-radius:999px;cursor:pointer;transition:background .18s,color .18s;}
  .bm-opt:hover{color:var(--blue);}
  .bm-opt.active{background:var(--blue);color:#fff;}
  .bm-viewport{perspective:1200px;animation:bmFloat 5s ease-in-out infinite;}
  @keyframes bmFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
  @media (prefers-reduced-motion:reduce){.bm-viewport{animation:none;}}
  .bm-flipper{position:relative;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.4,.05,.2,1);}
  .bm-flipper.is-back{transform:rotateY(180deg);}
  .bm-face{width:100%;height:auto;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .bm-face.bm-back{position:absolute;top:0;left:0;transform:rotateY(180deg);}
  .bm-body{fill:#E6EDF6;stroke:#D3E0EE;stroke-width:1.5;}
  .bm-limb{fill:none;stroke:#E6EDF6;stroke-linecap:round;stroke-linejoin:round;}
  .bm-limb-edge{fill:none;stroke:#D3E0EE;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .bm-region{cursor:pointer;outline:none;}
  .bm-region>rect,.bm-region>ellipse,.bm-region>circle{fill:rgba(37,99,235,0);stroke:none;pointer-events:all;transition:fill .18s;}
  .bm-region>.bm-stroke{fill:none;stroke:rgba(37,99,235,0);stroke-linecap:round;pointer-events:stroke;transition:stroke .18s;}
  .bm-region:hover>rect,.bm-region:hover>ellipse,.bm-region:hover>circle{fill:rgba(37,99,235,.20);}
  .bm-region:hover>.bm-stroke{stroke:rgba(37,99,235,.20);}
  .bm-region:focus-visible>rect,.bm-region:focus-visible>ellipse,.bm-region:focus-visible>circle{fill:rgba(37,99,235,.20);}
  .bm-region.is-sel>rect,.bm-region.is-sel>ellipse,.bm-region.is-sel>circle{fill:rgba(37,99,235,.45);}
  .bm-region.is-sel>.bm-stroke{stroke:rgba(37,99,235,.45);}

  .bm-conds{margin-top:10px;}
  .bm-flag{margin:0 0 8px;padding:8px 10px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;font-size:12px;line-height:1.55;color:#B91C1C;}
  .bm-cond-label{margin:0 0 6px;font-size:11.5px;color:var(--muted);}
  .bm-cond-row{display:flex;flex-wrap:wrap;gap:6px;}
  .bm-cond{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;color:var(--text);cursor:pointer;transition:border-color .18s,color .18s,background .18s;}
  .bm-cond:hover{border-color:var(--blue);color:var(--blue);}
  .bm-cond.is-on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark);font-weight:600;}

  .bm-prof{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;}
  .bm-prof-label{margin:0 0 8px;font-size:11.5px;color:var(--muted);}
  .bm-prof-group{display:flex;align-items:flex-start;gap:8px;margin-bottom:7px;}
  .bm-prof-key{flex:0 0 64px;font-size:12px;color:var(--muted);padding-top:5px;}
  .bm-prof-row{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .bm-prof-opt{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:12px;color:var(--text);cursor:pointer;transition:border-color .18s,color .18s,background .18s;}
  .bm-prof-opt:hover{border-color:var(--blue);color:var(--blue);}
  .bm-prof-opt.is-on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark);font-weight:600;}
  .bm-readout{margin:14px 0 0;font-size:13.5px;color:var(--text);min-height:22px;}
  .bm-readout b{color:var(--blue);}
  .bm-side h3{font-size:20px;color:var(--ink);margin:0 0 14px;}
  .bm-side ul{list-style:none;padding:0;margin:0 0 20px;display:flex;flex-direction:column;gap:12px;}
  .bm-side li{font-size:14px;color:var(--text);line-height:1.6;padding-left:22px;position:relative;}
  .bm-side li::before{content:'';position:absolute;left:0;top:8px;width:8px;height:8px;border-radius:50%;background:var(--blue-soft);border:2px solid var(--blue);}
  @media (max-width:980px){.bm-wrap{grid-template-columns:1fr;gap:28px;}}
  /* chat composer variant */
  .bm-chat-panel{position:absolute;left:12px;right:12px;bottom:calc(100% + 10px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px rgba(4,27,74,.14);padding:14px 16px 16px;z-index:40;}
  .bm-chat-panel[hidden]{display:none;}
  .bm-panel-head{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:10px;}
  .bm-panel-head button{border:0;background:transparent;font-size:15px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 4px;}
  .bm-chat-panel .bm-viewport{max-width:220px;margin:0 auto;}
  #bm-toggle{background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:16px;line-height:1;padding:6px 9px;color:var(--text);}
  #bm-toggle:hover{border-color:var(--blue);color:var(--blue);}

  .error-tip { color: #dc2626; font-size: 13px; text-align: center; margin-top: 6px; display: none; }

  /* ---- 对话列表侧边栏 ---- */
  #sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 260px;
    background: rgba(255,255,255,.97); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; z-index: 100; box-shadow: 2px 0 16px rgba(10,70,80,.08);
  }
  .sidebar-head {
    padding: 14px 16px; font-weight: 800; border-bottom: 1px solid var(--border);
    font-size: 15px; color: var(--accent-dark); background: linear-gradient(180deg, #f2faf9, #fff);
  }
  #conv-list { flex: 1; overflow-y: auto; padding: 8px; list-style: none; margin: 0; }
  #conv-list li {
    padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; transition: background .18s;
  }
  #conv-list li:hover { background: #f0f7f6; }
  #conv-list li.active { background: var(--accent-light); color: var(--accent-dark); font-weight: 600; }
  #conv-list .conv-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #conv-list .conv-del { opacity: 0; border: none; background: none; cursor: pointer; color: var(--muted); font-size: 13px; padding: 0 2px; }
  #conv-list li:hover .conv-del { opacity: 1; }
  #conv-list .empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: 13px; }
  .sidebar-foot { padding: 10px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 90; display: none; }
  #menu-btn { display: none; border: none; background: none; font-size: 22px; cursor: pointer; line-height: 1; padding: 0 4px; color: #fff; }

  @media (min-width: 769px) {
    body { margin-left: 260px; }
    .bg-particles, body::before { left: 260px; }
  }
  @media (max-width: 768px) {
    body { margin-left: 0; }
    #sidebar { transform: translateX(-100%); transition: transform .25s; box-shadow: 2px 0 12px rgba(0,0,0,.15); }
    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: block; }
    .subtitle { display: none; }
    .bubble { max-width: 100%; }
    .msg .meta { max-width: 86%; }
    #welcome { padding: 30px 12px 20px; }
    .doctor-card { padding: 16px 22px 16px 16px; gap: 14px; }
    .doctor-avatar { width: 68px; height: 68px; }
    .avatar-inner { font-size: 34px; }
    .doctor-name { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }

<body>
<style>
  /* ===== V2 诊室场景 ===== */
  :root { --doc-accent: #0e7c86; }
  #chat { max-width: 960px; }

  /* ---- 对话场景（贴顶舞台） ---- */
  #scene {
    position: sticky; top: 0; z-index: 5;
    height: clamp(225px, 33vh, 315px);
    margin: 0 -20px 16px; border-radius: 0 0 24px 24px; overflow: hidden;
    background:
      radial-gradient(400px 200px at 75% 0%, rgba(255,255,255,.5), transparent 60%),
      linear-gradient(180deg, #e2f0f1 0%, #cfE3e6 55%, #b6d2d7 100%);
    box-shadow: 0 6px 22px rgba(15,60,70,.14);
    border-bottom: 1px solid rgba(14,124,134,.18);
  }
  .scene-bg { position: absolute; inset: 0; pointer-events: none; }
  .scene-window { position: absolute; top: 16px; right: 22px; width: 150px; opacity: .95; }
  .scene-monitor {
    position: absolute; left: 20px; top: 22px; width: 118px;
    background: #0b2530; border-radius: 10px; padding: 6px 6px 4px;
    box-shadow: 0 5px 12px rgba(0,0,0,.28);
  }
  .scene-monitor svg { width: 100%; display: block; }
  .scene-monitor .ecg-path { stroke: #4ade80; stroke-dasharray: 200; stroke-dashoffset: 200; animation: ecg 1.6s linear infinite; }
  .scene-plant { position: absolute; left: 150px; bottom: 34px; font-size: 42px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); animation: sway 4.2s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
  .desk {
    position: absolute; left: 5%; right: 5%; bottom: 0; height: 28px;
    background: linear-gradient(180deg, #dcc9a6, #bfa67f); border-radius: 14px 14px 0 0;
    box-shadow: 0 -3px 10px rgba(0,0,0,.1);
  }
  .desk::before { content: ""; position: absolute; top: 6px; left: 12%; right: 12%; height: 2px; background: rgba(255,255,255,.45); border-radius: 2px; }
  .scene-char { position: absolute; bottom: 40px; display: flex; flex-direction: column; align-items: center; }
  .scene-char.doctor { left: 8%; }
  .scene-char.user { right: 8%; }
  .scene-char .char-avatar {
  width: clamp(100px, 12vw, 132px); height: clamp(100px, 12vw, 132px);
  border-radius: 50%; padding: 7px; overflow: hidden;
  background: linear-gradient(160deg, #ffffff, #dcefed);
  border: 3px solid var(--doc-accent);
  box-shadow: 0 12px 20px rgba(20,60,70,.32), inset 0 0 0 2px rgba(255,255,255,.65);
  display: flex; align-items: center; justify-content: center;
  animation: idle 3.8s ease-in-out infinite;
}
  .scene-char.user .char-avatar { border-color: #94a3b8; background: linear-gradient(160deg, #ffffff, #eef1f2); }
.scene-char.user .char-avatar { border-color: #94a3b8; background: linear-gradient(160deg, #ffffff, #eef1f2); }
.scene-char.user .char-avatar svg { transform: scaleX(-1); }
  .scene-char .char-avatar svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
.scene-char::after {
  content: ""; position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%);
  width: 78%; height: 15px; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(20,60,70,.32) 0%, rgba(20,60,70,0) 70%);
}
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(.5deg); } }
  .scene-char.speaking .char-avatar { animation: talk 0.85s ease-in-out infinite; }
  @keyframes talk {
    0%,100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-9px) scale(1.03); }
    60% { transform: translateY(-2px) scale(1); }
  }
  .scene-char.thinking .char-avatar { animation: think 0.5s ease-in-out infinite; }
  @keyframes think { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-2deg); } }
  .char-name {
    margin-top: 7px; background: rgba(255,255,255,.95); padding: 3px 13px; border-radius: 13px;
    font-size: 13px; font-weight: 800; color: #0f3a42;
    border: 2px solid var(--doc-accent); box-shadow: 0 2px 7px rgba(0,0,0,.12); white-space: nowrap;
  }
  .char-tag { font-size: 11px; color: #4b6a70; margin-top: 4px; background: rgba(255,255,255,.65); padding: 1px 9px; border-radius: 9px; white-space: nowrap; }
  .doc-status {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #0f6b74; background: rgba(255,255,255,.96);
    border: 1px dashed var(--doc-accent); padding: 2px 11px; border-radius: 11px;
    white-space: nowrap; opacity: 0; transition: opacity .25s; z-index: 2;
  }
  .doc-status.busy { opacity: 1; }
  .speech {
    position: absolute; left: 50%; bottom: 42px; transform: translateX(-50%);
    width: min(560px, 76%);
    background: rgba(255,255,255,.97); border: 2px solid var(--doc-accent);
    border-radius: 16px 16px 16px 5px; padding: 10px 15px 11px;
    box-shadow: 0 12px 30px rgba(15,60,70,.24); animation: popIn .3s ease;
  }
  .speech.user { border-color: #94a3b8; border-radius: 16px 16px 5px 16px; }
  @keyframes popIn { from { transform: translateX(-50%) scale(.96); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .speech-who { font-size: 12px; font-weight: 800; color: var(--doc-accent); margin-bottom: 3px; }
  .speech.user .speech-who { color: #64748b; }
  .speech-text { font-size: 14.5px; line-height: 1.65; color: #1f2d33; max-height: 100px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }

  /* ---- 对话记录（剧本式，非气泡） ---- */
  #transcript { padding: 4px 4px 22px; }
  .line { display: flex; flex-direction: column; }
  .line + .line { margin-top: 16px; padding-top: 13px; border-top: 1px dashed rgba(14,124,134,.22); }
  .line-who { font-size: 13px; font-weight: 800; color: var(--doc-accent); display: flex; align-items: center; gap: 7px; }
  .line.user .line-who { color: #475569; }
  .line-role { font-size: 11px; font-weight: 500; color: #94a3b8; background: #eef2f4; padding: 1px 8px; border-radius: 8px; }
  .line-say { margin-top: 5px; font-size: 15px; line-height: 1.75; color: #253440; word-break: break-word; }
  .line-say p { margin: 6px 0; }
  .line-say ul, .line-say ol { margin: 6px 0 6px 22px; }
  .line-say h3, .line-say h4 { font-size: 15px; margin: 10px 0 4px; }
  .line-say strong { font-weight: 600; }
  .line-say blockquote { border-left: 3px solid var(--border); color: var(--muted); padding-left: 10px; margin: 8px 0; font-size: 13px; }
  .line-say table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .line-say th, .line-say td { border: 1px solid var(--border); padding: 6px 10px; font-size: 14px; text-align: left; }
  .line-say th { background: #f3f4f6; font-weight: 600; }
  .line-say pre { background: #f6f8fa; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; overflow-x: auto; font-size: 13px; margin: 8px 0; }
  .line-say code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .line-say :not(pre) > code { background: #f3f4f6; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .line-say a { color: var(--accent); text-decoration: none; }
  .line-say a:hover { text-decoration: underline; }
  .line-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .line-steps .stp {
    font-size: 11px; color: #0f6b74; background: #e8f6f5; border: 1px solid #cfe9e7;
    border-radius: 10px; padding: 2px 9px; animation: stepIn .3s ease both;
  }

  /* ---- 回答分节卡片 ---- */
  .sec-card {
    border: 1px solid var(--border); border-left: 4px solid #94a3b8; border-radius: 12px;
    margin: 10px 0; padding: 12px 15px; background: #fff;
    box-shadow: 0 2px 8px rgba(15,60,70,.05);
  }
  .sec-card.summary { border-left-color: #f6a821; background: linear-gradient(180deg, #fffdf4, #fff); }
  .sec-card.detail { border-left-color: var(--accent); }
  .sec-card.prof { border-left-color: #7c6fd8; }
  .sec-card.refs { border-left-color: #94a3b8; background: #f8fafc; }
  .sec-head { font-weight: 800; font-size: 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .sec-card.summary .sec-body { font-size: 16px; line-height: 1.85; }
  .sec-card.summary .sec-body p:first-child { margin-top: 0; }
  .sec-card.refs .sec-body { font-size: 12.5px; color: #475569; }

  /* ---- 回答风格选择 ---- */
  .persona-pick { margin-top: 22px; }
  .pick-title { font-size: 13px; color: var(--muted); margin-bottom: 11px; }
  .pick-grid { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .persona {
    position: relative; width: 112px; background: rgba(255,255,255,.92);
    border: 2px solid var(--border); border-radius: 16px; padding: 10px 8px 9px;
    cursor: pointer; transition: all .22s; text-align: center;
  }
  .persona:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(15,80,90,.16); }
  .persona.on { border-color: var(--p-accent, var(--doc-accent)); background: #fff; }
  .persona.on::after {
    content: "✓"; position: absolute; top: 6px; right: 7px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--p-accent, var(--doc-accent)); color: #fff;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .persona .p-avatar {
  width: 72px; height: 84px; margin: 0 auto 7px; border-radius: 14px; overflow: hidden;
  background: linear-gradient(160deg, #ffffff, #e4f1f0); border: 1px solid rgba(14,124,134,.18);
}
  .persona .p-avatar svg { width: 100%; height: 100%; display: block; }
  .p-name { font-size: 13px; font-weight: 800; }
  .p-style { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* 头部风格切换按钮 */
  #persona-btn {
    width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(255,255,255,.65);
    background: rgba(255,255,255,.2); cursor: pointer; padding: 3px; flex-shrink: 0;
    transition: all .25s; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #persona-btn:hover { transform: scale(1.1); border-color: #fff; }
  #persona-btn svg { width: 100%; height: 100%; display: block; border-radius: 50%; }
#persona-btn { overflow: hidden; }
#persona-btn { overflow: hidden; }

  /* 风格选择弹窗 */
  #persona-modal { position: fixed; inset: 0; z-index: 120; display: none; align-items: center; justify-content: center; padding: 20px; }
  #persona-modal.open { display: flex; }
  .persona-panel {
    background: #fff; border-radius: 20px; padding: 24px; max-width: 500px; width: 100%;
    box-shadow: 0 24px 60px rgba(10,60,70,.32); animation: popIn2 .3s ease; position: relative;
  }
  @keyframes popIn2 { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  .panel-title { font-size: 16px; font-weight: 800; margin-bottom: 16px; text-align: center; }
  .panel-close { position: absolute; top: 12px; right: 14px; border: none; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
  .panel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  /* 欢迎卡中的头像适配 SVG */
  .doctor-card .avatar-inner { font-size: 0; padding: 0; }
  .doctor-card .avatar-inner { overflow: hidden; }
.doctor-card .avatar-inner { overflow: hidden; }
.doctor-card .avatar-inner svg { width: 100%; height: 100%; border-radius: 50%; }

  @media (max-width: 768px) {
    #scene { margin: 0 -12px 14px; height: 240px; }
    .scene-window { width: 96px; right: 8px; }
    .scene-monitor { width: 82px; left: 8px; top: 14px; }
    .scene-plant { left: 96px; font-size: 30px; }
    .speech { width: 82%; bottom: 36px; }
    .speech-text { max-height: 76px; font-size: 13.5px; }
    .char-name { font-size: 12px; }
    .panel-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>

<aside id="sidebar">
  <div class="sidebar-head">历史对话</div>
  <ul id="conv-list"></ul>
</aside>
<div id="mask"></div>

<!-- 回答风格选择弹窗 -->
<div id="persona-modal">
  <div class="persona-panel">
    <button class="panel-close" id="persona-close" title="关闭">✕</button>
    <div class="panel-title">选择回答风格</div>
    <div class="panel-grid" id="persona-modal-grid"></div>
  </div>
</div>

<header>
  <button id="menu-btn">☰</button>
  <div class="hosp-brand">

<script>
var BM_GEO={male:{sh:50,wh:34,hh:38,armW:21,legW:30,headRx:23,headRy:27},
            female:{sh:44,wh:28,hh:44,armW:18,legW:27,headRx:21,headRy:25}};
var BM_CX=130;
var BM_LABEL={head:'头 / 面部',neck:'颈',chest:'胸',
  abd_ur:'右上腹',abd_ul:'左上腹',abd_lr:'右下腹',abd_ll:'左下腹',
  shoulder:'肩',arm_up:'上臂',elbow:'肘',hand:'前臂 / 手腕',
  groin:'髋 / 腹股沟',thigh:'大腿',knee:'膝',calf:'小腿',foot:'踝 / 足',
  head_b:'后脑 / 头',neck_b:'项部（颈后）',back_up:'上背',back_low:'下背 / 腰',
  buttock:'臀 / 骶尾部',shoulder_b:'肩后',arm_up_b:'上臂后侧',elbow_b:'肘后',
  hand_b:'前臂 / 手背',thigh_b:'大腿后侧',knee_b:'腘窝（膝后）',calf_b:'小腿后侧',foot_b:'足跟'};
function bmBodyPath(g){var c=BM_CX,sy=92,wy=170,hy=218,hb=244;
  return 'M'+(c-g.sh)+','+sy
   +'Q'+(c-g.sh+3)+','+(sy-16)+' '+(c-19)+','+(sy-16)
   +'L'+(c+19)+','+(sy-16)
   +'Q'+(c+g.sh-3)+','+(sy-16)+' '+(c+g.sh)+','+sy
   +'Q'+(c+g.wh+5)+','+(wy-6)+' '+(c+g.wh)+','+wy
   +'Q'+(c+g.hh)+','+(hy-28)+' '+(c+g.hh)+','+hy
   +'L'+(c+g.hh)+','+hb+'L'+(c-g.hh)+','+hb+'L'+(c-g.hh)+','+hy
   +'Q'+(c-g.hh)+','+(hy-28)+' '+(c-g.wh)+','+wy
   +'Q'+(c-g.wh-5)+','+(wy-6)+' '+(c-g.sh)+','+sy+'Z';}
function bmArmPath(g,s){var c=BM_CX;var sx=c+s*(g.sh-6),ex=c+s*(g.sh+1),wx=c+s*(g.sh+6);
  return 'M'+sx+',100 Q'+(c+s*(g.sh+4))+',158 '+ex+',212 Q'+(c+s*(g.sh+5))+',250 '+wx+',288';}
function bmLegPath(g,s){var c=BM_CX,hx=c+s*Math.round(g.hh*0.48),kx=c+s*Math.round(g.hh*0.44),ax=c+s*Math.round(g.hh*0.46);
  return 'M'+hx+',246 Q'+(c+s*Math.round(g.hh*0.46))+',300 '+kx+',352 Q'+(c+s*Math.round(g.hh*0.45))+',400 '+ax+',452';}
function bmPt(g,s,which){var c=BM_CX;
  if(which=='sh')return [c+s*(g.sh-8),99];
  if(which=='el')return [c+s*(g.sh+1),212];
  if(which=='wr')return [c+s*(g.sh+6),288];
  if(which=='hp')return [c+s*Math.round(g.hh*0.48),246];
  if(which=='kn')return [c+s*Math.round(g.hh*0.44),352];
  return [c+s*Math.round(g.hh*0.46),452];}
function bmSeg(g,s,a,b,w){var p1=bmPt(g,s,a),p2=bmPt(g,s,b);
  return '<path class="bm-stroke" style="stroke-width:'+w+'" d="M'+p1[0]+','+p1[1]+' L'+p2[0]+','+p2[1]+'"/>';}
function bmR(id,side,inner){var lb=BM_LABEL[id]||id;
  return '<g class="bm-region" data-part="'+id+'" data-side="'+side+'" tabindex="0" role="button" aria-label="选择部位：'+lb+'">'+inner+'</g>';}
function bmRegions(g,view){
  var c=BM_CX,o=[],s;
  if(view=='front'){
    o.push(bmR('head',0,'<ellipse cx="'+c+'" cy="46" rx="'+g.headRx+'" ry="'+g.headRy+'"/>'));
    o.push(bmR('neck',0,'<rect x="'+(c-12)+'" y="68" width="24" height="26" rx="6"/>'));
    o.push(bmR('chest',0,'<rect x="'+(c-30)+'" y="98" width="60" height="42" rx="9"/>'));
    /* MIRROR: front view -> patient RIGHT is on the VIEWER'S LEFT */
    o.push(bmR('abd_ur',0,'<rect x="'+(c-30)+'" y="142" width="28" height="28" rx="6"/>'));
    o.push(bmR('abd_ul',0,'<rect x="'+(c+2)+'" y="142" width="28" height="28" rx="6"/>'));
    o.push(bmR('abd_lr',0,'<rect x="'+(c-30)+'" y="172" width="28" height="26" rx="6"/>'));
    o.push(bmR('abd_ll',0,'<rect x="'+(c+2)+'" y="172" width="28" height="26" rx="6"/>'));
    o.push(bmR('groin',0,'<rect x="'+(c-32)+'" y="202" width="64" height="40" rx="10"/>'));
  }else{
    o.push(bmR('head_b',0,'<ellipse cx="'+c+'" cy="46" rx="'+g.headRx+'" ry="'+g.headRy+'"/>'));
    o.push(bmR('neck_b',0,'<rect x="'+(c-12)+'" y="68" width="24" height="26" rx="6"/>'));
    o.push(bmR('back_up',0,'<rect x="'+(c-32)+'" y="98" width="64" height="46" rx="9"/>'));
    o.push(bmR('back_low',0,'<rect x="'+(c-30)+'" y="146" width="60" height="54" rx="9"/>'));
    o.push(bmR('buttock',0,'<rect x="'+(c-g.hh+2)+'" y="202" width="'+(2*g.hh-4)+'" height="40" rx="12"/>'));
  }
  var shId=view=='front'?'shoulder':'shoulder_b';
  var auId=view=='front'?'arm_up':'arm_up_b';
  var elId=view=='front'?'elbow':'elbow_b';
  var hdId=view=='front'?'hand':'hand_b';
  for(var i=0;i<2;i++){s=i?1:-1;var p=bmPt(g,s,'sh');
    o.push(bmR(shId,s,'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(g.armW*0.62)+'"/>'));
    o.push(bmR(auId,s,bmSeg(g,s,'sh','el',g.armW)));
    var pe=bmPt(g,s,'el');
    o.push(bmR(elId,s,'<circle cx="'+pe[0]+'" cy="'+pe[1]+'" r="'+(g.armW*0.55)+'"/>'));
    o.push(bmR(hdId,s,bmSeg(g,s,'el','wr',g.armW*0.92)));
  }
  var thId=view=='front'?'thigh':'thigh_b';
  var knId=view=='front'?'knee':'knee_b';
  var cfId=view=='front'?'calf':'calf_b';
  var ftId=view=='front'?'foot':'foot_b';
  for(var j=0;j<2;j++){s=j?1:-1;
    o.push(bmR(thId,s,bmSeg(g,s,'hp','kn',g.legW)));
    var pk=bmPt(g,s,'kn');
    o.push(bmR(knId,s,'<circle cx="'+pk[0]+'" cy="'+pk[1]+'" r="'+(g.legW*0.6)+'"/>'));
    o.push(bmR(cfId,s,bmSeg(g,s,'kn','an',g.legW*0.85)));
    var pa=bmPt(g,s,'an');
    o.push(bmR(ftId,s,'<ellipse cx="'+pa[0]+'" cy="'+(pa[1]+12)+'" rx="'+(g.legW*0.42)+'" ry="11"/>'));
  }
  return o;
}
function bmFace(gender,view){
  var g=BM_GEO[gender],p=[];
  p.push('<path class="bm-body" d="'+bmBodyPath(g)+'"/>');
  p.push('<path class="bm-limb" style="stroke-width:'+g.armW+'" d="'+bmArmPath(g,-1)+'"/>');
  p.push('<path class="bm-limb" style="stroke-width:'+g.armW+'" d="'+bmArmPath(g,1)+'"/>');
  p.push('<path class="bm-limb" style="stroke-width:'+g.legW+'" d="'+bmLegPath(g,-1)+'"/>');
  p.push('<path class="bm-limb" style="stroke-width:'+g.legW+'" d="'+bmLegPath(g,1)+'"/>');
  p.push('<ellipse class="bm-body" cx="'+BM_CX+'" cy="46" rx="'+g.headRx+'" ry="'+g.headRy+'"/>');
  p.push('<rect class="bm-body" x="'+(BM_CX-12)+'" y="68" width="24" height="26" rx="6"/>');
  p=p.concat(bmRegions(g,view));
  return '<svg class="bm-face bm-'+view+'" viewBox="0 0 260 500" xmlns="http://www.w3.org/2000/svg" aria-label="'+
    (gender=='male'?'男性':'女性')+(view=='front'?'正面':'背面')+'人体部位图">'+p.join('')+'</svg>';
}

var bmProf={nature:null,duration:null,severity:null,radiate:null,accompany:[]};
function bmProfText(){var p=bmProf,t=[];
  if(p.nature)t.push('性质为'+p.nature);
  if(p.duration)t.push('持续'+p.duration);
  if(p.severity)t.push('程度'+p.severity);
  if(p.radiate&&p.radiate!=='无')t.push('放射至'+p.radiate);
  if(p.accompany&&p.accompany.length)t.push('伴'+p.accompany.join('、'));
  return t.length?('，'+t.join('，')):'';}
function bmQuestion(part,cond){var lb=BM_LABEL[part]||part,prof=bmProfText();
  if(cond)return '我'+lb+'不舒服'+prof+'，可能是'+cond+'吗？想了解它的典型表现、需要做什么检查，以及什么情况下需要就医？';
  return '我'+lb+'不舒服'+prof+'，可能的原因有哪些、需要做哪些检查、日常要注意什么，以及什么情况下需要就医？';}
function bmInit(flipId,outId,onPick){
  var flip=document.getElementById(flipId),out=document.getElementById(outId);
  if(!flip)return;
  var gender='male',view='front',sel=null,cond=null;
  function profileBox(){
    var b=document.getElementById(flipId+'_prof');
    if(!b){b=document.createElement('div');b.className='bm-prof';b.id=flipId+'_prof';
      if(out&&out.parentNode)out.parentNode.insertBefore(b,out.nextSibling);}
    return b;
  }
  function fire(){
    if(onPick&&sel)onPick(sel,BM_LABEL[sel]||sel,bmQuestion(sel,cond));
  }
  function renderProfile(part){
    var box=profileBox();
    if(!BM_CONDITIONS[part]){box.innerHTML='';return;}
    var groups=[
      ['nature','疼痛性质',['钝痛','刺痛','绞痛','烧灼感','胀痛','酸痛'],false],
      ['duration','持续时间',['几小时','1-3天','3天以上','反复发作'],false],
      ['severity','严重程度',['轻(能忍)','中(影响活动)','重(难忍)'],false],
      ['radiate','放射到哪',['无','肩臂','背部','下肢'],false],
      ['accompany','伴随症状',['发热','恶心呕吐','出汗','头晕','乏力'],true]
    ];
    var h='<p class="bm-prof-label">症状刻画（可选，补充越准，判断越准）</p>';
    groups.forEach(function(g){
      h+='<div class="bm-prof-group"><span class="bm-prof-key">'+g[1]+'</span><div class="bm-prof-row">';
      g[3].forEach(function(opt){h+='<button type="button" class="bm-prof-opt" data-g="'+g[0]+'" data-v="'+opt+'">'+opt+'</button>';});
      h+='</div></div>';
    });
    box.innerHTML=h;
    box.querySelectorAll('.bm-prof-opt').forEach(function(bt){
      bt.addEventListener('click',function(){
        var g=bt.getAttribute('data-g'),v=bt.getAttribute('data-v');
        if(g==='accompany'){
          bt.classList.toggle('is-on');
          bmProf[g]=[].slice.call(box.querySelectorAll('.bm-prof-opt[data-g="accompany"].is-on'))
            .map(function(x){return x.getAttribute('data-v');});
        }else{
          box.querySelectorAll('.bm-prof-opt[data-g="'+g+'"]').forEach(function(x){x.classList.remove('is-on');});
          bt.classList.add('is-on');
          bmProf[g]=v;
        }
        fire();
      });
    });
  }
  function condsBox(){
    var b=document.getElementById(flipId+'_conds');
    if(!b){b=document.createElement('div');b.className='bm-conds';b.id=flipId+'_conds';
      if(out&&out.parentNode)out.parentNode.insertBefore(b,out.nextSibling);}
    return b;
  }
  function renderConds(part){
    var c=BM_CONDITIONS[part],box=condsBox();
    if(!c){box.innerHTML='';return;}
    var h='';
    if(c.flag)h+='<p class="bm-flag">'+c.flag+'</p>';
    h+='<p class="bm-cond-label">该部位常见情况（仅供参考，非诊断）</p><div class="bm-cond-row">';
    c.list.forEach(function(t){
      h+='<button type="button" class="bm-cond" data-cond="'+t+'">'+t+'</button>';});
    h+='</div>';
    box.innerHTML=h;
    box.querySelectorAll('.bm-cond').forEach(function(bt){
      bt.addEventListener('click',function(){
        box.querySelectorAll('.bm-cond').forEach(function(x){x.classList.remove('is-on');});
        bt.classList.add('is-on');
        cond=bt.getAttribute('data-cond');
        if(out)out.innerHTML='已选择：<b>'+(BM_LABEL[sel]||sel)+'</b> \u00b7 '+cond;
        if(onPick)onPick(sel,BM_LABEL[sel]||sel,bmQuestion(sel,cond));
      });
    });
  }
  function draw(){
    flip.innerHTML=bmFace(gender,'front')+bmFace(gender,'back');
    flip.classList.toggle('is-back',view==='back');
    if(sel){var n=flip.querySelector('.bm-region[data-part="'+sel+'"]');if(n)n.classList.add('is-sel');}
    flip.querySelectorAll('.bm-region').forEach(function(r){
      function pick(){sel=r.getAttribute('data-part');cond=null;
        bmProf={nature:null,duration:null,severity:null,radiate:null,accompany:[]};
        flip.querySelectorAll('.bm-region').forEach(function(x){x.classList.remove('is-sel');});
        r.classList.add('is-sel');
        var lb=BM_LABEL[sel]||sel;
        if(out)out.innerHTML='已选择：<b>'+lb+'</b>';
        renderConds(sel);
        renderProfile(sel);
        if(onPick)onPick(sel,lb,bmQuestion(sel,null));}
      r.addEventListener('click',pick);
      r.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
    });
  }
  function bar(){
    var box=flip.parentNode.parentNode;
    box.querySelectorAll('.bm-opt').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.hasAttribute('data-gender')){gender=b.getAttribute('data-gender');}
        if(b.hasAttribute('data-view')){view=b.getAttribute('data-view');}
        box.querySelectorAll('.bm-opt').forEach(function(x){x.classList.remove('active');});
        box.querySelectorAll('.bm-opt[data-gender="'+gender+'"],.bm-opt[data-view="'+view+'"]').forEach(function(x){x.classList.add('active');});
        draw();});
    });
  }
  draw();bar();
}

(function(){
  var panel=document.getElementById('bm-panel');
  var tog=document.getElementById('bm-toggle');
  var close=document.getElementById('bm-close');
  if(!panel||!tog)return;
  function open(){panel.hidden=false;if(close)close.focus();}
  function shut(){panel.hidden=true;}
  tog.addEventListener('click',function(){panel.hidden?open():shut();});
  if(close)close.addEventListener('click',shut);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!panel.hidden)shut();});
  document.addEventListener('click',function(e){
    if(panel.hidden)return;
    if(panel.contains(e.target)||tog.contains(e.target))return;
    shut();
  });
  bmInit('bmFlipChat','bmOutChat',function(part,label,q){
    var inp=document.getElementById('input');
    if(inp){inp.value=q;inp.dispatchEvent(new Event('input'));inp.focus();}
    shut();
  });
})();

  /* ================= 回答分节渲染：人话总结 → 详细推理 → 专业描述 → 参考引用 ================= */
  function splitSections(md) {
    var lines = md.split("\n");
    var sections = [];
    var cur = { title: null, content: [] };
    var hRe = /^(#{1,4})\s+(.*?)\s*#*\s*$/;
    var bRe = /^\*\*(.+?)\*\*\s*[:：]?\s*$/;
    lines.forEach(function (l) {
      var m = l.match(hRe) || l.match(bRe);
      if (m) { sections.push(cur); cur = { title: m[2], content: [] }; }
      else cur.content.push(l);
    });
    sections.push(cur);
    var out = { summary: [], detail: [], prof: [], refs: [] };
    sections.forEach(function (s) {
      var t = (s.title || "").toLowerCase();
      var c = s.content.join("\n").trim();
      if (!t && !c) return;
      if (/参考|引用|reference|来源|出处|文献/.test(t)) { out.refs.push({ title: s.title, content: c }); return; }
      if (/一句话|总结|小结|核心结论|先说结论|结论先行/.test(t)) { out.summary.push({ title: s.title, content: c }); return; }
      if (/专业描述|专业原理|专业说明|医学原理|机制详解/.test(t)) { out.prof.push({ title: s.title, content: c }); return; }
      out.detail.push({ title: s.title, content: c });
    });
    return out;
  }

  function heuristicSections(md) {
    var lines = md.split("\n");
    var body = [], refs = [];
    lines.forEach(function (l) {
      var t = l.trim();
      if (/^(?:\[\d+\]|\d+[.、])\s*(?:https?:\/\/|doi[: ]|pmid[: ])/i.test(t) || /^(?:https?:\/\/|doi[: ]|pmid[: ])/i.test(t)) refs.push(l);
      else body.push(l);
    });
    var text = body.join("\n").replace(/\n{3,}/g, "\n\n").trim();
    var summary = "", detail = text, prof = "";
    if (text.length > 160) {
      var m = text.match(/^([^。！？\n]{1,120}[。！？][^。！？\n]{0,60}[。！？]?)/);
      if (m && m[1].length < text.length * 0.6) { summary = m[1]; detail = text.slice(m[1].length).trim(); }
    }
    if (detail.length > 700) {
      var paras = detail.split(/\n{2,}/);
      if (paras.length >= 3) { prof = paras.pop(); detail = paras.join("\n\n"); }
    }
    return {
      summary: [{ title: null, content: summary }],
      detail: [{ title: null, content: detail }],
      prof: [{ title: null, content: prof }],
      refs: [{ title: null, content: refs.join("\n") }]
    };
  }

  function renderAnswer(md) {
    if (!md) return "";
    var sec = splitSections(md);
    var has = sec.summary.length || sec.detail.length || sec.prof.length || sec.refs.length;
    if (!has) sec = heuristicSections(md);
    var out = "";
    function card(icon, title, mdText, cls) {
      if (!mdText || !mdText.trim()) return "";
      return '<div class="sec-card ' + cls + '"><div class="sec-head">' + icon + " " + title +
        '</div><div class="sec-body">' + renderMD(mdText) + "</div></div>";
    }
    function joinTitles(arr) {
      return arr.map(function (s) { return (s.title ? "### " + s.title + "\n\n" : "") + s.content; }).join("\n\n");
    }
    function joinPlain(arr) {
      return arr.map(function (s) { return s.content; }).join("\n\n");
    }
    out += card("💬", "一句话总结", joinPlain(sec.summary), "summary");
    out += card("🔍", "详细解释与推理", joinTitles(sec.detail), "detail");
    out += card("🧬", "专业描述", joinTitles(sec.prof), "prof");
    out += card("📚", "参考引用", joinPlain(sec.refs), "refs");
    return out || renderMD(md);
  }

  function plainText(md) {
    return md
      .replace(/```[\s\S]*?```/g, "（图表）")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/[`*>_|~]/g, "")
      .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function renderPreviews() {

  var ALLOWED_TYPES = ["image/jpeg", "image/png", "image/gif", "image/webp"];
  var MAX_FILE_SIZE = 10 * 1024 * 1024;
  function handleFiles(files) {
    Array.from(files).forEach(function (file) {
      if (pendingImages.length >= 4) return;
      if (!ALLOWED_TYPES.includes(file.type)) { showError("仅支持 JPG/PNG/GIF/WebP 图片"); return; }
      if (file.size > MAX_FILE_SIZE) { showError("图片大小不能超过 10MB"); return; }
      var reader = new FileReader();
      reader.onload = function (e) {
        var dataUrl = e.target.result;

    });
  }

  function sanitizeMD(html) {
    return html
      .replace(/<script[\s\S]*?<\/script>/gi, "")
      .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, "")
      .replace(/href\s*=\s*["']javascript:[^"']*["']/gi, 'href="#"');
  }

      var id = "mmd-" + (++mermaidSeq);

  /* ================= SSE ================= */
  function parseSSE(buf, handlers) {
    var blocks = buf.split("\n\n");
    var rest = blocks.pop();
    blocks.forEach(function (block) {
      var event = "message", data = "";
      block.split("\n").forEach(function (line) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      });
      if (handlers[event]) handlers[event](data);
    });
    return rest;
  }

  async function send() {
    var text = input.value.trim();
    var hasImages = pendingImages.length > 0;
    if ((!text && !hasImages) || state.sending) return;
    clearError();

    if (!state.convId) state.convId = genId();
    input.value = ""; autoResize();

    var apiImages = [];
    if (hasImages) {
      pendingImages.forEach(function (img) { apiImages.push({ base64_data: img.base64, media_type: img.mediaType }); });
      pendingImages = [];
      renderPreviews();
    }

    addLine("user", text, apiImages);
    setSpeech("user", text || "（上传了检查图片）");

    var line = document.createElement("div");
    line.className = "line ai";
    var who = document.createElement("div");
    who.className = "line-who";
    who.innerHTML = persona.name + ' <span class="line-role">AI 助手</span>';
    var stepsWrap = document.createElement("div");
    stepsWrap.className = "line-steps";
    var say = document.createElement("div");
    say.className = "line-say";
    var cursor = document.createElement("span");
    cursor.className = "cursor";
    say.appendChild(cursor);
    line.appendChild(who); line.appendChild(stepsWrap); line.appendChild(say);
    transcript.appendChild(line);

    var STEP_TEXT = {
      emergency: "🚨 识别到紧急情况，需立即就医",
      refuse: "🚫 这个问题超出了我的能力范围",
      retrieve: "🔍 正在查阅循证医学资料",
      tool_call: "🛠️ 正在调用医学工具分析",
      tool_result: "✅ 参考资料已就绪",
      generate: "✍️ 正在组织通俗易懂的回答",
      verify: "🛡️ 正在校验引用与安全性"
    };
    function addStep(ev) {
      var chip = document.createElement("span");
      chip.className = "stp";
      chip.textContent = STEP_TEXT[ev.type] || ("· " + (ev.summary || ""));
      stepsWrap.appendChild(chip);
      setDocStatus(STEP_TEXT[ev.type] || ev.summary || "");
      scrollToBottom();
    }

    setSending(true);
    $("scene-doctor").classList.add("thinking");
    if (doc3d) doc3d.setThinking(true);
    var full = "";
    try {
      var resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text || "请分析上传的图片", conversation_id: state.convId, images: apiImages.length ? apiImages : undefined })
      });
      if (!resp.ok) {
        if (resp.status === 401) throw new Error("服务端开启了 API Key 鉴权，请先设置后再访问");
        throw new Error("请求失败（" + resp.status + "）");
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        buf = parseSSE(buf, {
          delta: function (d) {
            try { full += JSON.parse(d).text || ""; } catch (e) {}
            say.innerHTML = renderAnswer(full);
            say.appendChild(cursor);
            setSpeech("ai", plainText(full) + " ▌");
            scrollToBottom();
          },
          step: function (d) { try { addStep(JSON.parse(d)); } catch (e) {} },
          done: function (d) {
            try {
              var obj = JSON.parse(d);
              if (!full && obj.reply) full = obj.reply;
            } catch (e) {}
          },
          error: function (d) {
            var msg = "处理出错";
            try { msg = JSON.parse(d).error || msg; } catch (e) {}
            throw new Error(msg);
          }
        });
      }
      if (!full) {
        parseSSE(buf, {});
        full = say.textContent;
      }
      if (cursor.parentNode === say) say.removeChild(cursor);
      if (full) say.innerHTML = renderAnswer(full);
      else say.textContent = "（无响应）";
      renderMermaid(say);
      setSpeech("ai", plainText(full) || "（无响应）");
      saveHistory();
    } catch (e) {
      if (cursor.parentNode === say) say.removeChild(cursor);
      say.textContent = "";
      showError("⚠️ " + e.message);
    } finally {
      setSending(false);
      setDocStatus("");
      $("scene-doctor").classList.remove("thinking");
      if (doc3d) doc3d.setThinking(false);
      input.focus();
    }
  }

      var templeL = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.015, 0.015), mats.frame);
      templeL.position.set(-0.215, 0.08, 0.33); glasses.add(templeL);
      var templeR = templeL.clone(); templeR.position.x = 0.215; glasses.add(templeR);
      glasses.visible = false;
      // 头发组 / 眉毛组
      var hairGroup = new THREE.Group(); head.add(hairGroup);
      var browGroup = new THREE.Group(); head.add(browGroup);
      function clearGroup(g) { while (g.children.length) g.remove(g.children[0]); }
      function rebuildHair(color, style) {
        clearGroup(hairGroup); clearGroup(browGroup);
        mats.hair.color.set(color);
        var cap = new THREE.Mesh(new THREE.SphereGeometry(0.35, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.5), mats.hair);
        cap.position.set(0, 0.03, 0); cap.castShadow = true; hairGroup.add(cap);
        var fringe = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.13, 0.18), mats.hair);
        fringe.position.set(0, 0.24, 0.25); fringe.castShadow = true; hairGroup.add(fringe);
        if (style === "cute") {
          var spike = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.2, 10), mats.hair);
          spike.position.set(0.03, 0.34, 0.06); spike.rotation.z = 0.35; spike.castShadow = true; hairGroup.add(spike);
          var tuftL = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), mats.hair);
          tuftL.position.set(-0.2, 0.3, 0.05); tuftL.scale.set(1, 0.55, 0.7); tuftL.castShadow = true; hairGroup.add(tuftL);
          var tuftR = tuftL.clone(); tuftR.position.x = 0.2; hairGroup.add(tuftR);
        } else if (style === "long") {
          var sideL = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.95, 14), mats.hair);
          sideL.position.set(-0.36, -0.32, 0); sideL.castShadow = true; hairGroup.add(sideL);
          var sideR = sideL.clone(); sideR.position.x = 0.36; hairGroup.add(sideR);
        }
        var b1 = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.03, 0.03), mats.hair);
        b1.position.set(-0.13, 0.16, 0.32); browGroup.add(b1);
        var b2 = b1.clone(); b2.position.x = 0.13; browGroup.add(b2);
      }

      // ---- 动画状态 ----
      var st = { speaking: false, thinking: false };
      var rotY = 0, targetRotY = 0, dragging = false, lastX = 0;
      renderer.domElement.addEventListener("pointerdown", function (e) {
        dragging = true; lastX = e.clientX;
        mount.classList.add("dragging");
      });
      window.addEventListener("pointermove", function (e) {
        if (!dragging) return;
        targetRotY += (e.clientX - lastX) * 0.01;
        lastX = e.clientX;
      });
      window.addEventListener("pointerup", function () { dragging = false; mount.classList.remove("dragging"); });

      function resize() {
        var w = mount.clientWidth, h = mount.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);

      var clock = new THREE.Clock();
      var nextBlink = 2.5;
      (function animate() {
        requestAnimationFrame(animate);
        var t = clock.getElapsedTime();
        root.position.y = Math.sin(t * 1.3) * 0.03;
        torso.scale.y = 1 + Math.sin(t * 2.1) * 0.02;
        rotY += (targetRotY - rotY) * 0.08;
        root.rotation.y = Math.sin(t * 0.45) * 0.14 + rotY;
        if (t > nextBlink) nextBlink = t + 2.2 + Math.random() * 3.2;
        var blink = Math.max(0, 1 - Math.max(0, Math.abs(t - nextBlink - 0.5) - 0.4) * 6);
        eyeL.scale.y = 1 - blink * 0.93;
        eyeR.scale.y = 1 - blink * 0.93;
        var ms = st.speaking ? 0.55 + 0.45 * Math.abs(Math.sin(t * 9)) : 1;
        mouth.scale.set(1.25, 0.5 * ms, 0.5);
        head.rotation.z = st.thinking ? Math.sin(t * 5) * 0.07 : (st.speaking ? Math.sin(t * 4) * 0.03 : 0);
        renderer.render(scene, camera);
      })();

      function applyPersona(p) {
        var cfg = DOC3D_CONFIG[p.id] || DOC3D_CONFIG.handsome;
        mats.skin.color.set(cfg.skin);
        rebuildHair(cfg.hair, cfg.style);
        glasses.visible = !!cfg.glasses;
        blushL.visible = blushR.visible = !!cfg.blush;
      }

      doc3d = {
        applyPersona: applyPersona,
        setSpeaking: function (v) { st.speaking = !!v; },
        setThinking: function (v) { st.thinking = !!v; }
      };
    } catch (e) {
      console.error("3D doctor init failed:", e);
    }
  }
  loadThreeJS(initDoc3D);

  /* ================= 启动 ================= */
  $("user-avatar").innerHTML = USER_SVG;
  renderPersonaGrids();
  setPersona(persona.id, true);
  setSpeech("ai", "您好，我是" + persona.name + "。有什么健康问题想了解？随时问我。");
  restoreHistory();
  var _q = new URLSearchParams(location.search).get('q');
  if (_q) { input.value = _q; autoResize(); }
  input.focus();
})();
</script>
</body>
</html>
