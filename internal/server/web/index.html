<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Agent — 循证医学AI助手</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --accent: #2563eb; --accent-dark: #1d4ed8;
    --text: #1f2328; --muted: #6b7280; --border: #e5e7eb;
    --user-bubble: #2563eb; --user-text: #ffffff; --ai-bubble: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
  }
  header {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .logo { font-size: 20px; font-weight: 700; }
  .logo span { color: var(--accent); }
  .subtitle { font-size: 12px; color: var(--muted); flex: 1; }
  #new-chat {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 14px; font-size: 13px; color: var(--text); cursor: pointer;
  }
  #new-chat:hover { border-color: var(--accent); color: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 20px 0; }
  #chat { max-width: 820px; margin: 0 auto; padding: 0 20px; }
  /* 欢迎页 */
  #welcome { text-align: center; padding: 80px 20px 40px; }
  #welcome h1 { font-size: 26px; margin-bottom: 12px; }
  #welcome p { color: var(--muted); margin-bottom: 28px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .chip {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 10px 18px; font-size: 14px; cursor: pointer; color: var(--text); max-width: 360px;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  /* 消息 */
  .msg { display: flex; margin: 18px 0; }
  .msg.user { justify-content: flex-end; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 10px;
  }
  .msg.user .avatar { background: var(--accent); color: #fff; margin: 0 0 0 10px; order: 2; }
  .bubble {
    max-width: 78%; padding: 12px 16px; border-radius: 14px; line-height: 1.7; font-size: 15px;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--ai-bubble); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .bubble p { margin: 6px 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 20px; }
  .bubble h3 { font-size: 15px; margin: 10px 0 4px; }
  .bubble strong { font-weight: 600; }
  .bubble blockquote {
    border-left: 3px solid var(--border); color: var(--muted);
    padding-left: 10px; margin: 8px 0; font-size: 13px;
  }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -2px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* 思考过程步骤 */
  .steps { border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 8px; }
  .step-line { font-size: 12px; color: var(--muted); padding: 2px 0; line-height: 1.5; }
  /* 底部输入区 */
  footer { background: var(--card); border-top: 1px solid var(--border); padding: 12px 20px 8px; flex-shrink: 0; }
  #input-area { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px; font-size: 15px; font-family: inherit; line-height: 1.5; max-height: 160px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: #fff; border: none; border-radius: 12px;
    padding: 12px 22px; font-size: 15px; cursor: pointer; flex-shrink: 0;
  }
  #send:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .hint { max-width: 820px; margin: 8px auto 0; text-align: center; font-size: 12px; color: var(--muted); }
  .error-tip { color: #dc2626; font-size: 13px; text-align: center; margin-top: 6px; display: none; }
  @media (max-width: 640px) {
    .subtitle { display: none; }
    .bubble { max-width: 88%; }
    #welcome { padding: 40px 12px 24px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span>🩺</span> Doctor Agent</div>
  <div class="subtitle">循证医学AI助手 · 每条回答有据可查</div>
  <button id="new-chat">＋ 新对话</button>
</header>

<main id="scroll-area">
  <div id="chat">
    <div id="welcome">
      <h1>你好，我是 Doctor Agent 👋</h1>
      <p>循证医学AI助手，覆盖中国人群常见健康问题。身体不适，随时问我。</p>
      <div class="suggestions">
        <button class="chip">我一喝牛奶就拉肚子，是乳糖不耐受吗？</button>
        <button class="chip">我在广东生活，耳鸣鼻塞，会是鼻咽癌吗？</button>
        <button class="chip">G6PD 缺乏的人能吃哪些药？</button>
        <button class="chip">我和丈夫都是地贫携带者，孩子会得地贫吗？</button>
      </div>
    </div>
    <div id="messages"></div>
  </div>
</main>

<footer>
  <div id="input-area">
    <textarea id="input" rows="1" placeholder="输入你的健康问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="error-tip" id="error-tip"></div>
  <p class="hint">AI 回答仅供医学教育和信息参考，不能替代执业医师诊断；紧急情况请立即拨打 120</p>
</footer>

<script>
(function () {
  "use strict";
  var CONV_KEY = "doctor-agent-conv";
  var MSG_KEY = "doctor-agent-msgs";

  var $ = function (id) { return document.getElementById(id); };
  var input = $("input"), sendBtn = $("send"), messagesEl = $("messages"),
      welcomeEl = $("welcome"), scrollArea = $("scroll-area"), errorTip = $("error-tip");

  var state = { convId: localStorage.getItem(CONV_KEY) || "", sending: false };

  function genId() { return "conv-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ---- 极简 Markdown 渲染（加粗/标题/列表/引用/换行，回答里常用的几种） ---- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function renderMD(text) {
    var lines = esc(text).split("\n");
    var html = "", inList = false;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var m;
      if ((m = line.match(/^#{1,4}\s+(.*)/))) { closeList(); html += "<h3>" + m[1] + "</h3>"; }
      else if ((m = line.match(/^\s*[-*]\s+(.*)/))) { if (!inList) { inList = true; html += "<ul>"; } html += "<li>" + m[1] + "</li>"; }
      else if ((m = line.match(/^\s*\d+[.、]\s+(.*)/))) { if (!inList) { inList = true; html += "<ol>"; } html += "<li>" + m[1] + "</li>"; }
      else if (line.trim() === "") { closeList(); }
      else if (/^&gt;/.test(line)) { closeList(); html += "<blockquote>" + line.replace(/^&gt;\s?/, "") + "</blockquote>"; }
      else { closeList(); html += "<p>" + line + "</p>"; }
    }
    closeList();
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return html;
    function closeList() { if (inList) { html += inList === "ul" ? "</ul>" : "</ol>"; inList = false; } }
  }

  function addMessage(role, text) {
    if (welcomeEl.style.display !== "none") welcomeEl.style.display = "none";
    var div = document.createElement("div");
    div.className = "msg " + role;
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "我" : "🩺";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    if (text !== "") bubble.innerHTML = renderMD(text);
    div.appendChild(avatar); div.appendChild(bubble);
    messagesEl.appendChild(div);
    scrollToBottom();
    return bubble;
  }

  function scrollToBottom() { scrollArea.scrollTop = scrollArea.scrollHeight; }

  function setSending(on) {
    state.sending = on;
    sendBtn.disabled = on;
    sendBtn.textContent = on ? "思考中…" : "发送";
    input.disabled = on;
  }

  function showError(msg) { errorTip.style.display = "block"; errorTip.textContent = msg; }
  function clearError() { errorTip.style.display = "none"; }

  /* ---- 会话持久化（刷新不丢） ---- */
  function saveHistory() {
    var items = [];
    messagesEl.querySelectorAll(".msg").forEach(function (el) {
      items.push({ role: el.classList.contains("user") ? "user" : "ai", text: el.querySelector(".bubble").textContent });
    });
    try { localStorage.setItem(MSG_KEY, JSON.stringify(items)); } catch (e) {}
  }
  function restoreHistory() {
    var items;
    try { items = JSON.parse(localStorage.getItem(MSG_KEY) || "[]"); } catch (e) { items = []; }
    if (!items.length || !state.convId) return;
    welcomeEl.style.display = "none";
    items.forEach(function (it) { addMessage(it.role, it.text); });
  }

  /* ---- SSE 流式请求 ---- */
  function parseSSE(buf, handlers) {
    // buf: 按 "\n\n" 切分事件块
    var blocks = buf.split("\n\n");
    var rest = blocks.pop();
    blocks.forEach(function (block) {
      var event = "message", data = "";
      block.split("\n").forEach(function (line) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      });
      if (handlers[event]) handlers[event](data);
    });
    return rest;
  }

  async function send() {
    var text = input.value.trim();
    if (!text || state.sending) return;
    clearError();

    if (!state.convId) { state.convId = genId(); localStorage.setItem(CONV_KEY, state.convId); }
    input.value = ""; autoResize();
    addMessage("user", text);
    var bubble = addMessage("ai", "");
    var stepsEl = document.createElement("div");
    stepsEl.className = "steps";
    var contentEl = document.createElement("div");
    contentEl.className = "answer";
    bubble.appendChild(stepsEl);
    bubble.appendChild(contentEl);

    var cursor = document.createElement("span");
    cursor.className = "cursor";
    contentEl.appendChild(cursor);
    var STEP_ICONS = {
      emergency: "🚨", refuse: "🚫", retrieve: "🔍",
      tool_call: "🛠️", tool_result: "✅", generate: "✍️", verify: "🛡️"
    };
    function addStep(ev) {
      var line = document.createElement("div");
      line.className = "step-line";
      line.textContent = (STEP_ICONS[ev.type] || "·") + " " + (ev.summary || "");
      stepsEl.appendChild(line);
      scrollToBottom();
    }

    setSending(true);
    var full = "";
    try {
      var resp = await fetch("/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation_id: state.convId })
      });
      if (!resp.ok) {
        if (resp.status === 401) throw new Error("服务端开启了 API Key 鉴权，请先在环境变量或配置中设置后再访问");
        throw new Error("请求失败（" + resp.status + "）");
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      for (;;) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        buf = parseSSE(buf, {
          delta: function (d) {
            try { full += JSON.parse(d).text || ""; } catch (e) {}
            contentEl.innerHTML = renderMD(full);
            contentEl.appendChild(cursor);
            scrollToBottom();
          },
          step: function (d) {
            try { addStep(JSON.parse(d)); } catch (e) {}
          },
          done: function (d) {
            // 紧急/拒答等无 delta 的响应，从 done 事件的 reply 取完整文本
            try {
              var obj = JSON.parse(d);
              if (!full && obj.reply) full = obj.reply;
            } catch (e) {}
          },
          error: function (d) {
            var msg = "处理出错";
            try { msg = JSON.parse(d).error || msg; } catch (e) {}
            throw new Error(msg);
          }
        });
      }
      if (!full) { // 紧急/拒答等无 delta 的响应，从 done 事件取
        // 重新读取剩余 buf
        buf = parseSSE(buf, {});
        full = contentEl.textContent;
      }
      contentEl.removeChild(cursor);
      if (full) contentEl.innerHTML = renderMD(full);
      else contentEl.textContent = "（无响应）";
      saveHistory();
    } catch (e) {
      contentEl.removeChild(cursor);
      contentEl.textContent = "";
      showError("⚠️ " + e.message);
    } finally {
      setSending(false);
      input.focus();
    }
  }

  /* ---- 事件绑定 ---- */
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", autoResize);
  function autoResize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () { input.value = chip.textContent; send(); });
  });
  $("new-chat").addEventListener("click", function () {
    state.convId = genId();
    localStorage.setItem(CONV_KEY, state.convId);
    localStorage.removeItem(MSG_KEY);
    messagesEl.innerHTML = "";
    welcomeEl.style.display = "";
  });

  restoreHistory();
  input.focus();
})();
</script>
</body>
</html>
