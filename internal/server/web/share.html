<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · 医答分享</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#1c2b33; --muted:#5f7681; --line:#e3ecf0; --brand:#0e7c86; --bg:#f6fafb; --card:#ffffff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; font-weight:700; color:var(--brand); }
  header .sub { font-weight:400; color:var(--muted); font-size:13px; margin-top:2px; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 48px; }
  .qa { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:16px 0; overflow-x:auto; }
  .q { color:var(--brand); font-weight:600; margin-bottom:10px; padding-bottom:10px; border-bottom:1px dashed var(--line); }
  .q::before { content:"问："; }
  .a::before { content:"答："; color:var(--muted); font-weight:600; }
  .a { margin-top:10px; }
  h1,h2,h3,h4 { margin:18px 0 8px; line-height:1.4; }
  table { border-collapse:collapse; width:100%; margin:12px 0; font-size:14px; }
  th,td { border:1px solid var(--line); padding:7px 10px; text-align:left; }
  th { background:#eef6f8; }
  code { background:#eef3f5; border-radius:4px; padding:1px 5px; font-size:13px; }
  pre { background:#f0f5f7; border-radius:8px; padding:12px; overflow-x:auto; }
  pre code { background:none; padding:0; }
  blockquote { border-left:3px solid var(--brand); margin:10px 0; padding:2px 12px; color:var(--muted); }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; border-top:1px solid var(--line); background:var(--card); }
  .err { text-align:center; color:var(--muted); padding:60px 0; }
</style>
</head>
<body>
<header>医答 · 分享阅读<div class="sub">__TITLE__</div></header>
<main id="app"><div class="err">加载中…</div></main>
<script>
var SHARE = __PAYLOAD__;

/* 极简 Markdown 渲染：标题/表格/列表/引用/粗体/行内代码/代码块 */
(function () {
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*\n]+)\*/g, "<em>$1</em>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function render(md) {
    var lines = md.split("\n"), out = [], i = 0, inCode = false, codeBuf = [];
    for (; i < lines.length; i++) {
      var l = lines[i];
      if (/^```/.test(l.trim())) {
        if (inCode) { out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>"); codeBuf = []; inCode = false; }
        else inCode = true;
        continue;
      }
      if (inCode) { codeBuf.push(l); continue; }
      var h = l.match(/^(#{1,4})\s+(.*)$/);
      if (h) { var n = h[1].length; out.push("<h" + n + ">" + inline(esc(h[2])) + "</h" + n + ">"); continue; }
      if (/^\s*\|.*\|\s*$/.test(l)) {
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) {
          var cells = lines[i].trim().replace(/^\||\|$/g, "").split("|");
          if (!cells.every(function (c) { return /^\s*:?-{2,}:?\s*$/.test(c); })) rows.push(cells);
          i++;
        }
        i--;
        if (rows.length) {
          var t = "<table>";
          rows.forEach(function (r, ri) {
            t += "<tr>" + r.map(function (c) { return (ri ? "<td>" : "<th>") + inline(esc(c.trim())) + (ri ? "</td>" : "</th>"); }).join("") + "</tr>";
          });
          out.push(t + "</table>");
        }
        continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
        i--;
        out.push("<ul>" + items.map(function (x) { return "<li>" + inline(esc(x)) + "</li>"; }).join("") + "</ul>");
        continue;
      }
      if (/^\s*\d+[.、]\s+/.test(l)) {
        var nums = [];
        while (i < lines.length && /^\s*\d+[.、]\s+/.test(lines[i])) { nums.push(lines[i].replace(/^\s*\d+[.、]\s+/, "")); i++; }
        i--;
        out.push("<ol>" + nums.map(function (x) { return "<li>" + inline(esc(x)) + "</li>"; }).join("") + "</ol>");
        continue;
      }
      if (/^>\s?/.test(l)) { out.push("<blockquote>" + inline(esc(l.replace(/^>\s?/, ""))) + "</blockquote>"); continue; }
      if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { out.push("<hr>"); continue; }
      if (l.trim() === "") continue;
      out.push("<p>" + inline(esc(l)) + "</p>");
    }
    return out.join("\n");
  }

  var app = document.getElementById("app");
  if (!SHARE || !SHARE.m || !SHARE.m.length) { app.innerHTML = '<div class="err">分享内容不存在或已被删除</div>'; return; }
  var html = "";
  SHARE.m.forEach(function (pair) {
    html += '<div class="qa">';
    if (pair.q) html += '<div class="q">' + inline(esc(pair.q)) + "</div>";
    html += '<div class="a">' + render(pair.a) + "</div></div>";
  });
  app.innerHTML = html;
})();
</script>
</body>
</html>
